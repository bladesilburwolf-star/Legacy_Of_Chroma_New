<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MAP_CRAFT // Texture Map Baker</title>
    <style>
        :root {
            --mc-bg: #212121;
            --mc-panel: #313131;
            --mc-border-light: #555555;
            --mc-border-dark: #111111;
            --mc-green: #55ff55;
            --mc-yellow: #ffff55;
        }

        body {
            background-color: var(--mc-bg);
            color: #ffffff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 16px;
            user-select: none;
        }

        h1 {
            color: var(--mc-green);
            font-size: 20px;
            margin-bottom: 12px;
            text-shadow: 2px 2px #000;
        }

        .mc-panel {
            background: var(--mc-panel);
            border: 4px solid;
            border-color: var(--mc-border-light) var(--mc-border-dark) var(--mc-border-dark) var(--mc-border-light);
            padding: 12px;
            margin-bottom: 16px;
        }

        .mc-btn {
            background: #707070;
            border: 3px solid;
            border-color: #a0a0a0 #303030 #303030 #a0a0a0;
            color: #fff;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }

        .mc-btn:active {
            border-color: #303030 #a0a0a0 #a0a0a0 #303030;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .map-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .map-card h3 {
            margin: 4px 0 8px 0;
            font-size: 13px;
            color: var(--mc-yellow);
        }

        canvas {
            width: 100%;
            max-width: 280px;
            height: auto;
            image-rendering: pixelated;
            border: 2px solid #000;
            background: #000;
            cursor: pointer;
        }

        canvas:hover {
            border-color: var(--mc-green);
        }

        .controls {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        label { font-size: 12px; }
        input[type=range] { cursor: pointer; }
        .sub-text { font-size: 10px; color: #aaa; margin-top: 4px; }
    </style>
</head>
<body>

    <h1>MAP_CRAFT // SHADERMAP HTML PORT</h1>

    <div class="mc-panel">
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <button class="mc-btn" onclick="document.getElementById('fileInput').click()">[ LOAD BASE TEXTURE ]</button>
        <button class="mc-btn" id="exportAllBtn" style="background:#3a703a; border-color:#55a055 #1e401e #1e401e #55a055;">[ EXPORT MAP SUITE ]</button>
        
        <div class="controls">
            <label>Normal Strength: <input type="range" id="strength" min="0.5" max="10" step="0.1" value="2.5"></label>
            <label>AO Radius: <input type="range" id="aoRad" min="1" max="8" step="1" value="3"></label>
        </div>
        <div class="sub-text">* Click on any map canvas individually to download that specific pass!</div>
    </div>

    <div class="grid">
        <div class="mc-panel map-card">
            <h3>BASE ALBEDO</h3>
            <canvas id="c_albedo" title="Click to download Albedo"></canvas>
        </div>
        <div class="mc-panel map-card">
            <h3>HEIGHT MAP</h3>
            <canvas id="c_height" title="Click to download Heightmap"></canvas>
        </div>
        <div class="mc-panel map-card">
            <h3>NORMAL MAP (OpenGL)</h3>
            <canvas id="c_normal" title="Click to download Normal Map"></canvas>
        </div>
        <div class="mc-panel map-card">
            <h3>ROUGHNESS MAP</h3>
            <canvas id="c_roughness" title="Click to download Roughness"></canvas>
        </div>
        <div class="mc-panel map-card">
            <h3>AMBIENT OCCLUSION</h3>
            <canvas id="c_ao" title="Click to download AO Map"></canvas>
        </div>
    </div>

<script>
    const fileInput = document.getElementById('fileInput');
    const strengthInput = document.getElementById('strength');
    const aoRadInput = document.getElementById('aoRad');
    const exportAllBtn = document.getElementById('exportAllBtn');

    const canvases = {
        albedo: document.getElementById('c_albedo'),
        height: document.getElementById('c_height'),
        normal: document.getElementById('c_normal'),
        roughness: document.getElementById('c_roughness'),
        ao: document.getElementById('c_ao')
    };

    let baseImage = null;
    let baseFileName = "texture";

    fileInput.addEventListener('change', (e) => {
        if (!e.target.files[0]) return;
        const file = e.target.files[0];
        baseFileName = file.name.substring(0, file.name.lastIndexOf('.')) || "texture";
        
        const img = new Image();
        img.onload = () => {
            baseImage = img;
            processAll();
        };
        img.src = URL.createObjectURL(file);
    });

    strengthInput.addEventListener('input', processAll);
    aoRadInput.addEventListener('input', processAll);

    // Helper: Download single canvas as PNG file
    function downloadCanvas(canvas, suffix) {
        canvas.toBlob((blob) => {
            if (!blob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${baseFileName}_${suffix}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }, 'image/png');
    }

    // Individual click downloads
    Object.keys(canvases).forEach(key => {
        canvases[key].addEventListener('click', () => {
            if (baseImage) downloadCanvas(canvases[key], key);
        });
    });

    // Bulk download all maps
    exportAllBtn.addEventListener('click', () => {
        if (!baseImage) return;
        Object.keys(canvases).forEach((key, index) => {
            setTimeout(() => {
                downloadCanvas(canvases[key], key);
            }, index * 200); // Stagger downloads slightly to prevent browser blocking
        });
    });

    function processAll() {
        if (!baseImage) return;
        const w = baseImage.width;
        const h = baseImage.height;

        Object.values(canvases).forEach(c => { c.width = w; c.height = h; });

        // 0. ALBEDO PASS
        const ctxA = canvases.albedo.getContext('2d');
        ctxA.drawImage(baseImage, 0, 0);
        const imgData = ctxA.getImageData(0, 0, w, h);
        const src = imgData.data;

        // 1. HEIGHT MAP (Luminance)
        const ctxH = canvases.height.getContext('2d');
        const imgH = ctxH.createImageData(w, h);
        const heights = new Float32Array(w * h);

        for (let i = 0; i < src.length; i += 4) {
            const lum = (src[i] * 0.299 + src[i+1] * 0.587 + src[i+2] * 0.114) / 255.0;
            heights[i / 4] = lum;
            const val = Math.floor(lum * 255);
            imgH.data[i] = val;
            imgH.data[i+1] = val;
            imgH.data[i+2] = val;
            imgH.data[i+3] = 255;
        }
        ctxH.putImageData(imgH, 0, 0);

        // 2. NORMAL MAP
        const ctxN = canvases.normal.getContext('2d');
        const imgN = ctxN.createImageData(w, h);
        const str = parseFloat(strengthInput.value);

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const x0 = x > 0 ? x - 1 : x;
                const x1 = x < w - 1 ? x + 1 : x;
                const y0 = y > 0 ? y - 1 : y;
                const y1 = y < h - 1 ? y + 1 : y;

                const dx = (heights[y * w + x1] - heights[y * w + x0]) * str;
                const dy = (heights[y1 * w + x] - heights[y0 * w + x]) * str;

                let nx = -dx, ny = -dy, nz = 1.0;
                const len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
                nx /= len; ny /= len; nz /= len;

                const idx = (y * w + x) * 4;
                imgN.data[idx]   = Math.floor((nx * 0.5 + 0.5) * 255);
                imgN.data[idx+1] = Math.floor((ny * 0.5 + 0.5) * 255);
                imgN.data[idx+2] = Math.floor((nz * 0.5 + 0.5) * 255);
                imgN.data[idx+3] = 255;
            }
        }
        ctxN.putImageData(imgN, 0, 0);

        // 3. ROUGHNESS MAP
        const ctxR = canvases.roughness.getContext('2d');
        const imgR = ctxR.createImageData(w, h);
        for (let i = 0; i < heights.length; i++) {
            const rough = Math.min(255, Math.max(0, Math.floor((1.0 - heights[i]) * 255 * 1.2)));
            const idx = i * 4;
            imgR.data[idx] = rough; imgR.data[idx+1] = rough; imgR.data[idx+2] = rough; imgR.data[idx+3] = 255;
        }
        ctxR.putImageData(imgR, 0, 0);

        // 4. AMBIENT OCCLUSION MAP
        const ctxAO = canvases.ao.getContext('2d');
        const imgAO = ctxAO.createImageData(w, h);
        const rad = parseInt(aoRadInput.value);

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let centerH = heights[y * w + x];
                let diffSum = 0;
                let samples = 0;

                for (let dy = -rad; dy <= rad; dy++) {
                    for (let dx = -rad; dx <= rad; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const nx = Math.min(w - 1, Math.max(0, x + dx));
                        const ny = Math.min(h - 1, Math.max(0, y + dy));
                        diffSum += Math.max(0, centerH - heights[ny * w + nx]);
                        samples++;
                    }
                }
                const aoVal = Math.floor(Math.max(0, 1.0 - (diffSum / samples) * 4.0) * 255);
                const idx = (y * w + x) * 4;
                imgAO.data[idx] = aoVal; imgAO.data[idx+1] = aoVal; imgAO.data[idx+2] = aoVal; imgAO.data[idx+3] = 255;
            }
        }
        ctxAO.putImageData(imgAO, 0, 0);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MAP_CRAFT v3 // ShaderMap 4 + 3D Painter & Studio Palette</title>
    <style>
        :root {
            --mc-bg: #1a1a1a;
            --mc-panel: #2d2d2d;
            --mc-border-light: #444;
            --mc-border-dark: #111;
            --mc-green: #55ff55;
            --mc-yellow: #ffff55;
            --mc-blue: #55ffff;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--mc-bg);
            color: #ffffff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 12px;
            user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            color: var(--mc-green);
            font-size: 18px;
            margin: 0 0 8px 0;
            text-shadow: 2px 2px #000;
        }

        .mc-panel {
            background: var(--mc-panel);
            border: 3px solid;
            border-color: var(--mc-border-light) var(--mc-border-dark) var(--mc-border-dark) var(--mc-border-light);
            padding: 8px 12px;
            margin-bottom: 8px;
        }

        .mc-btn {
            background: #505050;
            border: 2px solid;
            border-color: #808080 #202020 #202020 #808080;
            color: #fff;
            padding: 4px 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            text-shadow: 1px 1px #000;
        }

        .mc-btn:active, .mc-btn.active {
            border-color: #202020 #808080 #808080 #202020;
            background: #333;
            color: var(--mc-green);
        }

        .workspace {
            display: flex;
            gap: 8px;
            flex: 1;
            min-height: 0;
        }

        .left-pane {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-right: 4px;
        }

        .right-pane {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
        }

        .map-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .map-card h3 {
            margin: 2px 0 4px 0;
            font-size: 11px;
            color: var(--mc-yellow);
        }

        canvas.map-preview {
            width: 100%;
            max-width: 160px;
            height: auto;
            image-rendering: pixelated;
            border: 2px solid #000;
            background: #000;
            cursor: grab;
        }

        canvas.map-preview:hover {
            border-color: var(--mc-green);
        }

        #viewport3d {
            width: 100%;
            height: 100%;
            background: #000;
            border: 2px solid var(--mc-border-light);
            cursor: crosshair;
        }

        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 11px;
        }

        input[type=range] { width: 70px; cursor: pointer; }
        input[type=color] { border: none; width: 22px; height: 22px; cursor: pointer; background:none; }

        /* Color Palette Swatches */
        .palette-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .swatch {
            width: 20px;
            height: 20px;
            border: 2px solid #000;
            cursor: pointer;
        }

        .swatch:hover {
            border-color: #fff;
        }

        .panel-title {
            font-size: 11px;
            color: var(--mc-blue);
            font-weight: bold;
            margin-bottom: 6px;
        }
    </style>

    <!-- Import Three.js, OBJ Loader & Exporter -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
</head>
<body>

    <h1>MAP_CRAFT v3 // SHADERMAP + 3D STUDIO PAINTER</h1>

    <div class="workspace">
        
        <!-- LEFT PANE: BAKER, PAINT TOOLS & COLOR PALETTE -->
        <div class="left-pane">
            
            <!-- TEXTURE BAKER CONTROLS -->
            <div class="mc-panel">
                <div class="panel-title">// TEXTURE BAKER PASSES</div>
                <input type="file" id="fileInput" accept="image/*" style="display:none">
                <button class="mc-btn" onclick="document.getElementById('fileInput').click()">[ LOAD ALBEDO ]</button>
                <button class="mc-btn" id="exportAllBtn" style="color:var(--mc-green)">[ EXPORT MAP SUITE ]</button>
                
                <div class="controls" style="margin-top: 6px;">
                    <label>Norm: <input type="range" id="strength" min="0.5" max="10" step="0.1" value="2.5"></label>
                    <label>AO Rad: <input type="range" id="aoRad" min="1" max="8" step="1" value="3"></label>
                </div>
            </div>

            <!-- PAINT TOOLS & BRUSHES PANEL -->
            <div class="mc-panel">
                <div class="panel-title">// PAINT TOOLS & BRUSH PRESETS</div>
                <div class="controls">
                    <button class="mc-btn tool-btn active" id="toolPen" onclick="setTool('pen')">[ PEN ]</button>
                    <button class="mc-btn tool-btn" id="toolEraser" onclick="setTool('eraser')">[ ERASER ]</button>
                    <button class="mc-btn tool-btn" id="toolBucket" onclick="setTool('bucket')">[ BUCKET ]</button>

                    <label style="margin-left:6px;">Shape:
                        <select id="brushShape" class="mc-btn" style="padding:1px;">
                            <option value="square">Blocky (Square)</option>
                            <option value="round">Smooth (Round)</option>
                            <option value="noise">Noise Dither</option>
                        </select>
                    </label>
                </div>
            </div>

            <!-- COLOR PALETTE PANEL -->
            <div class="mc-panel">
                <div class="panel-title">// COLOR PALETTE STUDIO</div>
                <div class="controls">
                    <input type="color" id="paintColor" value="#55ff55" title="Active Paint Color">
                    <span id="hexLabel" style="color:var(--mc-green); font-size:11px;">#55ff55</span>
                    <button class="mc-btn" onclick="addCustomColor()">[+ ADD SWATCH]</button>
                </div>

                <div class="palette-container" id="paletteBox">
                    <!-- Minecraft Block Colors -->
                    <div class="swatch" style="background:#55ff55;" onclick="selectColor('#55ff55')"></div>
                    <div class="swatch" style="background:#866043;" onclick="selectColor('#866043')"></div>
                    <div class="swatch" style="background:#5c4033;" onclick="selectColor('#5c4033')"></div>
                    <div class="swatch" style="background:#737373;" onclick="selectColor('#737373')"></div>
                    <div class="swatch" style="background:#a62b2b;" onclick="selectColor('#a62b2b')"></div>
                    <div class="swatch" style="background:#2e6fbb;" onclick="selectColor('#2e6fbb')"></div>
                    <div class="swatch" style="background:#fcd12a;" onclick="selectColor('#fcd12a')"></div>
                    <div class="swatch" style="background:#4be3e3;" onclick="selectColor('#4be3e3')"></div>
                    <div class="swatch" style="background:#111111;" onclick="selectColor('#111111')"></div>
                    <div class="swatch" style="background:#ffffff;" onclick="selectColor('#ffffff')"></div>
                </div>
            </div>

            <!-- MAP PREVIEWS -->
            <div class="grid">
                <div class="mc-panel map-card">
                    <h3>BASE ALBEDO</h3>
                    <canvas id="c_albedo" class="map-preview" draggable="true" title="Drag to 3D View or click to save"></canvas>
                </div>
                <div class="mc-panel map-card">
                    <h3>HEIGHT MAP</h3>
                    <canvas id="c_height" class="map-preview" draggable="true" title="Drag to 3D View or click to save"></canvas>
                </div>
                <div class="mc-panel map-card">
                    <h3>NORMAL MAP</h3>
                    <canvas id="c_normal" class="map-preview" draggable="true" title="Drag to 3D View or click to save"></canvas>
                </div>
                <div class="mc-panel map-card">
                    <h3>ROUGHNESS</h3>
                    <canvas id="c_roughness" class="map-preview" draggable="true" title="Drag to 3D View or click to save"></canvas>
                </div>
                <div class="mc-panel map-card">
                    <h3>AMBIENT OCCLUSION</h3>
                    <canvas id="c_ao" class="map-preview" draggable="true" title="Drag to 3D View or click to save"></canvas>
                </div>
            </div>
        </div>

        <!-- RIGHT PANE: 3D VIEWPORT & PAINTING -->
        <div class="right-pane">
            <div class="mc-panel controls" style="margin-bottom:4px;">
                <input type="file" id="objFileInput" accept=".obj" style="display:none">
                <button class="mc-btn" onclick="document.getElementById('objFileInput').click()">[ LOAD OBJ ]</button>
                
                <label>Scale: 
                    <input type="range" id="objScaleSlider" min="1" max="500" value="100">
                    <span id="scaleVal" style="color:var(--mc-green);">100%</span>
                </label>

                <label>Mesh:
                    <select id="primitiveSelect" class="mc-btn" style="padding:1px;">
                        <option value="box">Cube</option>
                        <option value="sphere">Sphere</option>
                        <option value="plane">Plane</option>
                        <option value="cylinder">Cylinder</option>
                    </select>
                </label>

                <button class="mc-btn" id="paintToggleBtn">[ PAINT: OFF ]</button>
                <label>Size: <input type="range" id="brushSize" min="1" max="64" value="8"></label>

                <button class="mc-btn" id="exportObjBtn" style="color:var(--mc-yellow)">[ EXPORT OBJ ]</button>
            </div>

            <div id="viewport3d"></div>
        </div>

    </div>

<script>
    // --- 1. BAKER LOGIC ---
    const fileInput = document.getElementById('fileInput');
    const strengthInput = document.getElementById('strength');
    const aoRadInput = document.getElementById('aoRad');
    const exportAllBtn = document.getElementById('exportAllBtn');

    const canvases = {
        albedo: document.getElementById('c_albedo'),
        height: document.getElementById('c_height'),
        normal: document.getElementById('c_normal'),
        roughness: document.getElementById('c_roughness'),
        ao: document.getElementById('c_ao')
    };

    let baseImage = null;
    let baseFileName = "texture";

    fileInput.addEventListener('change', (e) => {
        if (!e.target.files[0]) return;
        const file = e.target.files[0];
        baseFileName = file.name.substring(0, file.name.lastIndexOf('.')) || "texture";
        const img = new Image();
        img.onload = () => { baseImage = img; processAll(); update3DTextures(); };
        img.src = URL.createObjectURL(file);
    });

    strengthInput.addEventListener('input', () => { processAll(); update3DTextures(); });
    aoRadInput.addEventListener('input', () => { processAll(); update3DTextures(); });

    function downloadCanvas(canvas, suffix) {
        canvas.toBlob((blob) => {
            if (!blob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${baseFileName}_${suffix}.png`;
            a.click();
            URL.revokeObjectURL(a.href);
        }, 'image/png');
    }

    Object.keys(canvases).forEach(key => {
        canvases[key].addEventListener('click', () => {
            if (baseImage && !isDragging) downloadCanvas(canvases[key], key);
        });
    });

    exportAllBtn.addEventListener('click', () => {
        if (!baseImage) return;
        Object.keys(canvases).forEach((key, index) => {
            setTimeout(() => downloadCanvas(canvases[key], key), index * 200);
        });
    });

    function processAll() {
        if (!baseImage && canvases.albedo.width === 0) return;
        const w = canvases.albedo.width || 512;
        const h = canvases.albedo.height || 512;

        const ctxA = canvases.albedo.getContext('2d');
        if (baseImage && canvases.albedo.width !== baseImage.width) {
            Object.values(canvases).forEach(c => { c.width = baseImage.width; c.height = baseImage.height; });
            ctxA.drawImage(baseImage, 0, 0);
        }
        
        const src = ctxA.getImageData(0, 0, w, h).data;

        // Heightmap Pass
        const ctxH = canvases.height.getContext('2d');
        const imgH = ctxH.createImageData(w, h);
        const heights = new Float32Array(w * h);
        for (let i = 0; i < src.length; i += 4) {
            const lum = (src[i] * 0.299 + src[i+1] * 0.587 + src[i+2] * 0.114) / 255.0;
            heights[i / 4] = lum;
            const val = Math.floor(lum * 255);
            imgH.data[i] = imgH.data[i+1] = imgH.data[i+2] = val; imgH.data[i+3] = 255;
        }
        ctxH.putImageData(imgH, 0, 0);

        // Normal Map Pass
        const ctxN = canvases.normal.getContext('2d');
        const imgN = ctxN.createImageData(w, h);
        const str = parseFloat(strengthInput.value);
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const x0 = x > 0 ? x - 1 : x, x1 = x < w - 1 ? x + 1 : x;
                const y0 = y > 0 ? y - 1 : y, y1 = y < h - 1 ? y + 1 : y;
                const dx = (heights[y * w + x1] - heights[y * w + x0]) * str;
                const dy = (heights[y1 * w + x] - heights[y0 * w + x]) * str;
                let nx = -dx, ny = -dy, nz = 1.0;
                const len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
                const idx = (y * w + x) * 4;
                imgN.data[idx]   = Math.floor((nx/len * 0.5 + 0.5) * 255);
                imgN.data[idx+1] = Math.floor((ny/len * 0.5 + 0.5) * 255);
                imgN.data[idx+2] = Math.floor((nz/len * 0.5 + 0.5) * 255);
                imgN.data[idx+3] = 255;
            }
        }
        ctxN.putImageData(imgN, 0, 0);

        // Roughness Pass
        const ctxR = canvases.roughness.getContext('2d');
        const imgR = ctxR.createImageData(w, h);
        for (let i = 0; i < heights.length; i++) {
            const rough = Math.min(255, Math.max(0, Math.floor((1.0 - heights[i]) * 255 * 1.2)));
            const idx = i * 4; imgR.data[idx] = imgR.data[idx+1] = imgR.data[idx+2] = rough; imgR.data[idx+3] = 255;
        }
        ctxR.putImageData(imgR, 0, 0);

        // Ambient Occlusion Pass
        const ctxAO = canvases.ao.getContext('2d');
        const imgAO = ctxAO.createImageData(w, h);
        const rad = parseInt(aoRadInput.value);
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let centerH = heights[y * w + x], diffSum = 0, samples = 0;
                for (let dy = -rad; dy <= rad; dy++) {
                    for (let dx = -rad; dx <= rad; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const nx = Math.min(w - 1, Math.max(0, x + dx)), ny = Math.min(h - 1, Math.max(0, y + dy));
                        diffSum += Math.max(0, centerH - heights[ny * w + nx]); samples++;
                    }
                }
                const aoVal = Math.floor(Math.max(0, 1.0 - (diffSum / samples) * 4.0) * 255);
                const idx = (y * w + x) * 4; imgAO.data[idx] = imgAO.data[idx+1] = imgAO.data[idx+2] = aoVal; imgAO.data[idx+3] = 255;
            }
        }
        ctxAO.putImageData(imgAO, 0, 0);
    }

    // Default Blank Texture Initialization
    Object.values(canvases).forEach(c => { c.width = 256; c.height = 256; });
    const ctxInit = canvases.albedo.getContext('2d');
    ctxInit.fillStyle = '#737373';
    ctxInit.fillRect(0,0,256,256);
    processAll();

    // --- 2. PAINT TOOLS & PALETTE STATE ---
    let currentTool = 'pen';
    const colorPicker = document.getElementById('paintColor');
    const hexLabel = document.getElementById('hexLabel');

    colorPicker.addEventListener('input', (e) => hexLabel.innerText = e.target.value);

    function selectColor(hex) {
        colorPicker.value = hex;
        hexLabel.innerText = hex;
    }

    function addCustomColor() {
        const hex = colorPicker.value;
        const box = document.getElementById('paletteBox');
        const div = document.createElement('div');
        div.className = 'swatch';
        div.style.background = hex;
        div.onclick = () => selectColor(hex);
        box.appendChild(div);
    }

    function setTool(toolName) {
        currentTool = toolName;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        if (toolName === 'pen') document.getElementById('toolPen').classList.add('active');
        if (toolName === 'eraser') document.getElementById('toolEraser').classList.add('active');
        if (toolName === 'bucket') document.getElementById('toolBucket').classList.add('active');
    }

    // Flood Fill Algorithm
    function floodFill(ctx, startX, startY, fillColorHex) {
        const w = ctx.canvas.width;
        const h = ctx.canvas.height;
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        const targetPos = (startY * w + startX) * 4;
        const targetR = data[targetPos], targetG = data[targetPos+1], targetB = data[targetPos+2];

        // Convert Hex to RGB
        const fillR = parseInt(fillColorHex.slice(1,3), 16);
        const fillG = parseInt(fillColorHex.slice(3,5), 16);
        const fillB = parseInt(fillColorHex.slice(5,7), 16);

        if (targetR === fillR && targetG === fillG && targetB === fillB) return;

        const stack = [[startX, startY]];
        while (stack.length) {
            const [x, y] = stack.pop();
            const pos = (y * w + x) * 4;

            if (data[pos] === targetR && data[pos+1] === targetG && data[pos+2] === targetB) {
                data[pos] = fillR; data[pos+1] = fillG; data[pos+2] = fillB; data[pos+3] = 255;

                if (x > 0) stack.push([x - 1, y]);
                if (x < w - 1) stack.push([x + 1, y]);
                if (y > 0) stack.push([x, y - 1]);
                if (y < h - 1) stack.push([x, y + 1]);
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    // --- 3. THREE.JS VIEWPORT, PAINTING & SCALING LOGIC ---
    const viewport = document.getElementById('viewport3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(0, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    viewport.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    
    // Lighting setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    let threeAlbedoTex = new THREE.CanvasTexture(canvases.albedo);
    let threeNormalTex = new THREE.CanvasTexture(canvases.normal);
    let threeRoughTex = new THREE.CanvasTexture(canvases.roughness);

    let activeMaterial = new THREE.MeshStandardMaterial({
        map: threeAlbedoTex,
        normalMap: threeNormalTex,
        roughnessMap: threeRoughTex,
        roughness: 0.5
    });

    let currentMesh = null;
    let rawBaseScale = new THREE.Vector3(1, 1, 1);
    const scaleSlider = document.getElementById('objScaleSlider');
    const scaleVal = document.getElementById('scaleVal');

    function createPrimitive(type) {
        if (currentMesh) scene.remove(currentMesh);
        let geo;
        if (type === 'box') geo = new THREE.BoxGeometry(2, 2, 2);
        else if (type === 'sphere') geo = new THREE.SphereGeometry(1.5, 32, 32);
        else if (type === 'plane') geo = new THREE.PlaneGeometry(3, 3);
        else if (type === 'cylinder') geo = new THREE.CylinderGeometry(1, 1, 2.5, 32);

        currentMesh = new THREE.Mesh(geo, activeMaterial);
        rawBaseScale.set(1, 1, 1);
        scaleSlider.value = 100;
        scaleVal.innerText = "100%";
        scene.add(currentMesh);
    }
    createPrimitive('box');

    document.getElementById('primitiveSelect').addEventListener('change', (e) => createPrimitive(e.target.value));

    // OBJ Loader with Auto-Fit
    const objFileInput = document.getElementById('objFileInput');
    objFileInput.addEventListener('change', (e) => {
        if (!e.target.files[0]) return;
        const file = e.target.files[0];
        const reader = new FileReader();

        reader.onload = (event) => {
            const loader = new THREE.OBJLoader();
            const obj = loader.parse(event.target.result);
            if (currentMesh) scene.remove(currentMesh);

            const bbox = new THREE.Box3().setFromObject(obj);
            const center = bbox.getCenter(new THREE.Vector3());
            const size = bbox.getSize(new THREE.Vector3());

            obj.position.sub(center);

            const maxDim = Math.max(size.x, size.y, size.z);
            const autoFactor = maxDim > 0 ? (3.0 / maxDim) : 1.0;

            rawBaseScale.set(autoFactor, autoFactor, autoFactor);
            obj.scale.copy(rawBaseScale);

            scaleSlider.value = 100;
            scaleVal.innerText = "100%";

            obj.traverse((child) => {
                if (child.isMesh) child.material = activeMaterial;
            });

            currentMesh = obj;
            scene.add(currentMesh);

            camera.position.set(0, 2, 5);
            controls.target.set(0, 0, 0);
            controls.update();
        };
        reader.readAsText(file);
    });

    scaleSlider.addEventListener('input', (e) => {
        const pct = parseFloat(e.target.value) / 100.0;
        scaleVal.innerText = `${e.target.value}%`;
        if (currentMesh) {
            currentMesh.scale.set(
                rawBaseScale.x * pct,
                rawBaseScale.y * pct,
                rawBaseScale.z * pct
            );
        }
    });

    function update3DTextures() {
        threeAlbedoTex.needsUpdate = true;
        threeNormalTex.needsUpdate = true;
        threeRoughTex.needsUpdate = true;
    }

    // --- 4. DRAG & DROP TEXTURES ---
    let draggedCanvasId = null;
    let isDragging = false;

    Object.keys(canvases).forEach(key => {
        canvases[key].addEventListener('dragstart', () => { draggedCanvasId = key; isDragging = true; });
        canvases[key].addEventListener('dragend', () => isDragging = false);
    });

    viewport.addEventListener('dragover', (e) => e.preventDefault());
    viewport.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!draggedCanvasId) return;

        if (draggedCanvasId === 'albedo') activeMaterial.map = threeAlbedoTex;
        if (draggedCanvasId === 'normal') activeMaterial.normalMap = threeNormalTex;
        if (draggedCanvasId === 'roughness') activeMaterial.roughnessMap = threeRoughTex;
        activeMaterial.needsUpdate = true;
    });

    // --- 5. SURFACE TEXTURE PAINT ENGINE ---
    let isPainting = false;
    let paintMode = false;
    const paintToggleBtn = document.getElementById('paintToggleBtn');
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    paintToggleBtn.addEventListener('click', () => {
        paintMode = !paintMode;
        controls.enabled = !paintMode;
        paintToggleBtn.classList.toggle('active', paintMode);
        paintToggleBtn.innerText = paintMode ? "[ PAINT: ON ]" : "[ PAINT: OFF ]";
    });

    viewport.addEventListener('mousedown', (e) => {
        if (!paintMode || !currentMesh) return;
        isPainting = true;

        // Trigger Bucket Fill on Click
        if (currentTool === 'bucket') {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(currentMesh, true);

            if (intersects.length > 0 && intersects[0].uv) {
                const uv = intersects[0].uv;
                const ctx = canvases.albedo.getContext('2d');
                const x = Math.floor(uv.x * canvases.albedo.width);
                const y = Math.floor((1.0 - uv.y) * canvases.albedo.height);
                floodFill(ctx, x, y, colorPicker.value);
                processAll();
                update3DTextures();
            }
        }
    });

    viewport.addEventListener('mouseup', () => { isPainting = false; });
    viewport.addEventListener('mousemove', (e) => {
        if (!paintMode || !isPainting || !currentMesh || currentTool === 'bucket') return;

        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(currentMesh, true);

        if (intersects.length > 0 && intersects[0].uv) {
            const uv = intersects[0].uv;
            const ctx = canvases.albedo.getContext('2d');
            const x = Math.floor(uv.x * canvases.albedo.width);
            const y = Math.floor((1.0 - uv.y) * canvases.albedo.height);

            const size = parseInt(document.getElementById('brushSize').value);
            const shape = document.getElementById('brushShape').value;
            const color = currentTool === 'eraser' ? '#737373' : colorPicker.value;

            ctx.fillStyle = color;

            if (shape === 'square') {
                ctx.fillRect(x - size / 2, y - size / 2, size, size);
            } else if (shape === 'round') {
                ctx.beginPath();
                ctx.arc(x, y, size / 2, 0, Math.PI * 2);
                ctx.fill();
            } else if (shape === 'noise') {
                for (let i = 0; i < size * 3; i++) {
                    const rx = x + (Math.random() - 0.5) * size;
                    const ry = y + (Math.random() - 0.5) * size;
                    ctx.fillRect(rx, ry, 1, 1);
                }
            }

            processAll();
            update3DTextures();
        }
    });

    // EXPORT OBJ FILE
    document.getElementById('exportObjBtn').addEventListener('click', () => {
        if (!currentMesh) return;
        const exporter = new THREE.OBJExporter();
        const result = exporter.parse(currentMesh);
        
        const blob = new Blob([result], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'mapcraft_studio_model.obj';
        a.click();
        URL.revokeObjectURL(a.href);
    });

    // Render Animation Loop
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = viewport.clientWidth / viewport.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });
</script>
</body>
</html>

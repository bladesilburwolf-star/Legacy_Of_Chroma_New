<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neondromeda - North Sector (Snow Mountains)</title>
  <style>
    @font-face {
      font-family: 'RetroCGA';
      src: url('assets/fonts/Px437_IBM_CGA.ttf') format('truetype');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #0a0f14; color: #cfe8ff; font-family: 'RetroCGA', monospace; }
    #canvas-container { width: 100vw; height: 100vh; }
    #hud {
      position: absolute; top: 40px; left: 35px; z-index: 20;
      background: rgba(0, 8, 16, 0.88); border: 2px solid #8ab4d4;
      padding: 10px 14px; max-width: 460px;
    }
    #hud .title { font-size: 13px; letter-spacing: 0.08em; color: #cfe8ff; }
    #hud .sub { font-size: 11px; color: #7a9ab0; margin-top: 4px; }
    #status {
      position: absolute; bottom: 18px; left: 35px; z-index: 20;
      font-size: 11px; color: #6a8aa0; background: rgba(0,0,0,0.75);
      padding: 5px 10px; border: 1px solid #234;
    }
    #msg {
      display: none; position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%); z-index: 50;
      background: rgba(0,10,20,0.95); border: 2px solid #8ab4d4;
      padding: 20px 32px; text-align: center; color: #cfe8ff;
    }
    .scanlines {
      position: absolute; inset: 0; z-index: 10; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, transparent 0, transparent 2px,
        rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 3px
      );
      mix-blend-mode: multiply;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="scanlines"></div>
  <div id="hud">
    <div class="title">NORTH SECTOR // SNOW MOUNTAINS</div>
    <div class="sub" id="hud-sub">WASD MOVE · F INTERACT · Q USE · SOUTH = HUB · N = FACTORY 2</div>
  </div>
  <div id="msg"><div id="msg-text"></div></div>
  <div id="status">Loading North Sector...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/engine/Three_js_system/room_builder_v3.js"></script>
  <script src="src/engine/Three_js_system/sprite_system_v3.js"></script>
  <script src="src/engine/Three_js_system/terrain_generator_v3.js"></script>
  <script src="src/engine/Three_js_system/heightmap_generator_v3.js"></script>
  <script src="src/engine/Three_js_system/normalmap_generator_v3.js"></script>
  <script src="src/engine/Three_js_system/skybox_system_v3.js"></script>
  <script src="src/engine/Three_js_system/clock_system_v3.js"></script>
  <script src="src/engine/Three_js_system/night_spawn_v3.js"></script>
  <script src="src/engine/Three_js_system/hp_bar_system_v3.js"></script>
  <script src="src/engine/Three_js_system/inventory_system_v3.js"></script>

  <script>
  (function () {
    const statusEl = document.getElementById('status');
    const hudSub = document.getElementById('hud-sub');
    const msgEl = document.getElementById('msg');
    const msgText = document.getElementById('msg-text');
    function flash(t, ms) {
      msgText.textContent = t;
      msgEl.style.display = 'block';
      setTimeout(function () { msgEl.style.display = 'none'; }, ms || 1600);
    }

    // North snow zone — same scale band as west road
    const ZONE_W = 2000;
    const ZONE_L = 2200;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8aa0b0);
    scene.fog = new THREE.FogExp2(0x8aa0b0, 0.00055);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 9000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const loader = new THREE.TextureLoader();
    function prep(tex) {
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      tex.generateMipmaps = false;
      return tex;
    }

    // Sky — cool snow palette
    const sky = SkyboxSystemV3.create(scene, {
      radius: Math.max(ZONE_L, ZONE_W) * 1.5,
      cycleMinutes: 8,
      startHour: 11,
      loader: loader,
      dayFog: 0x8aa0b0,
      nightFog: 0x0a0a1a
    });
    const clock = ClockSystemV3.create({ x: 35, y: 40, hour: 11 });

    // Terrain — mountains north, flat south entry from hub
    const TERRAIN_RES = 96;
    const hm = HeightmapGeneratorV3.create({ resolution: TERRAIN_RES, seed: 47 });
    hm.fbm({ scale: 3.5, octaves: 5 });
    hm.ridged({ scale: 2.8, octaves: 4 }); // blend peaks
    // Soft blend: re-fbm then flatten pads
    hm.fbm({ scale: 3.2, octaves: 5 });
    hm.flattenCircle(0.5, 0.88, 0.14, 0.04); // south hub entry
    hm.flattenCircle(0.5, 0.12, 0.22, 0.55); // northern plateau / ridge
    hm.flattenCircle(0.5, 0.45, 0.08, 0.08); // mid pass
    const heights = hm.getFloats();
    const nrmBake = NormalmapGeneratorV3.fromHeightmap(hm, { strength: 2.6 });
    const terrain = TerrainGeneratorV3.createFromHeights(scene, heights, {
      resolution: TERRAIN_RES,
      sizeX: ZONE_W,
      sizeZ: ZONE_L,
      maxHeight: 280,
      floorY: RoomBuilderV3.FLOOR_Y
    });

    (function applySnowGround() {
      const sun = new THREE.DirectionalLight(0xe8f0ff, 0.75);
      sun.name = 'terrain-sun';
      sun.position.set(120, 400, 80);
      scene.add(sun);
      scene.add(new THREE.AmbientLight(0x708090, 0.45));
      // Rock + snow tint via vertex colors already on terrain; overlay rock texture
      const rock = prep(loader.load('assets/textures/rock1.jpg'));
      rock.wrapS = THREE.RepeatWrapping;
      rock.wrapT = THREE.RepeatWrapping;
      rock.repeat.set(ZONE_W / 180, ZONE_L / 180);
      try {
        const mat = new THREE.MeshStandardMaterial({
          map: rock,
          normalMap: nrmBake.toTexture(),
          normalScale: new THREE.Vector2(1.4, 1.4),
          vertexColors: true,
          roughness: 0.92,
          color: 0xd8e4f0,
          side: THREE.DoubleSide
        });
        terrain.mesh.material.dispose();
        terrain.mesh.material = mat;
      } catch (e) {
        console.warn('snow mat', e);
      }
    })();

    // Props — boulders north, sparse trees south
    const props = [];
    function addProp(path, x, z, w, h) {
      const mat = new THREE.MeshBasicMaterial({
        map: prep(loader.load(path)),
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: true
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      mesh.position.set(x, terrain.getHeight(x, z) + h * 0.42, z);
      scene.add(mesh);
      props.push(mesh);
      return mesh;
    }
    for (let i = 0; i < 22; i++) {
      const x = (Math.random() - 0.5) * ZONE_W * 0.85;
      const z = -ZONE_L * 0.42 + Math.random() * ZONE_L * 0.4;
      addProp('assets/overworld/BOULDER-1.png', x, z, 34 + Math.random() * 20, 30 + Math.random() * 16);
    }
    for (let i = 0; i < 8; i++) {
      const x = (Math.random() - 0.5) * ZONE_W * 0.55;
      const z = ZONE_L * 0.28 + Math.random() * ZONE_L * 0.12;
      addProp('assets/overworld/TREE1-1.png', x, z, 48, 60);
    }

    // Factory shell landmark (north-central) — leads to secret_factory_2 later
    const S = RoomBuilderV3.shape;
    const FX = 0, FZ = -750;
    const shapes = [
      S({ id: 'fac_floor', layer: 'L1', geo: 'Cube',
        scale: { x: 160, y: 10, z: 120 }, sizeZ: 120,
        position: { x: FX, y: 6, z: FZ }, color: '#2a3038', solid: true }),
      S({ id: 'fac_back', layer: 'L2', geo: 'Cube',
        scale: { x: 160, y: 80, z: 14 }, sizeZ: 14,
        position: { x: FX, y: 48, z: FZ - 60 }, color: '#3a4450', solid: true }),
      S({ id: 'fac_l', layer: 'L2', geo: 'Cube',
        scale: { x: 14, y: 80, z: 120 }, sizeZ: 120,
        position: { x: FX - 80, y: 48, z: FZ }, color: '#343c48', solid: true }),
      S({ id: 'fac_r', layer: 'L2', geo: 'Cube',
        scale: { x: 14, y: 80, z: 120 }, sizeZ: 120,
        position: { x: FX + 80, y: 48, z: FZ }, color: '#343c48', solid: true }),
      S({ id: 'fac_fl', layer: 'L2', geo: 'Cube',
        scale: { x: 55, y: 80, z: 14 }, sizeZ: 14,
        position: { x: FX - 52, y: 48, z: FZ + 60 }, color: '#3a4450', solid: true }),
      S({ id: 'fac_fr', layer: 'L2', geo: 'Cube',
        scale: { x: 55, y: 80, z: 14 }, sizeZ: 14,
        position: { x: FX + 52, y: 48, z: FZ + 60 }, color: '#3a4450', solid: true }),
      S({ id: 'fac_door_top', layer: 'L2', geo: 'Cube',
        scale: { x: 50, y: 18, z: 14 }, sizeZ: 14,
        position: { x: FX, y: 78, z: FZ + 60 }, color: '#2a3038', solid: true }),
      S({ id: 'fac_sign', layer: 'L3', geo: 'Cube',
        scale: { x: 70, y: 18, z: 6 }, sizeZ: 6,
        position: { x: FX, y: 96, z: FZ + 64 }, color: '#ff5533', solid: false }),
      // D3 Ice Caverns entrance (east of mid-path)
      S({ id: 'ice_l', layer: 'L2', geo: 'Cube',
        scale: { x: 16, y: 55, z: 20 }, sizeZ: 20,
        position: { x: 380, y: 30, z: -200 }, color: '#4a6a8a', solid: true }),
      S({ id: 'ice_r', layer: 'L2', geo: 'Cube',
        scale: { x: 16, y: 55, z: 20 }, sizeZ: 20,
        position: { x: 440, y: 30, z: -200 }, color: '#4a6a8a', solid: true }),
      S({ id: 'ice_top', layer: 'L2', geo: 'Cube',
        scale: { x: 76, y: 16, z: 22 }, sizeZ: 22,
        position: { x: 410, y: 62, z: -200 }, color: '#5a7a9a', solid: true }),
      S({ id: 'ice_door', layer: 'L3', geo: 'Cube',
        scale: { x: 36, y: 42, z: 4 }, sizeZ: 4,
        position: { x: 410, y: 28, z: -188 }, color: '#88ccff', solid: false }),
    ];
    const room = RoomBuilderV3.build(scene, shapes, {
      layerZ: { L1: -20, L2: 0, L3: 10, L4: 20, UI: 40 }
    });

    function makeSign(text, x, z, color) {
      const c = document.createElement('canvas');
      c.width = 320; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 320, 64);
      ctx.strokeStyle = color || '#8ab4d4';
      ctx.lineWidth = 3;
      ctx.strokeRect(2, 2, 316, 60);
      ctx.fillStyle = color || '#8ab4d4';
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 160, 32);
      const mat = new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(c),
        transparent: true,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(100, 20), mat);
      mesh.position.set(x, terrain.getHeight(x, z) + 48, z);
      scene.add(mesh);
      props.push(mesh);
      return mesh;
    }
    makeSign('SECRET FACTORY', FX, FZ + 90, '#ff6644');
    makeSign('← HUB SOUTH', 0, ZONE_L * 0.42, '#00ff66');
    makeSign('INDUSTRIAL →', FX, FZ - 100, '#aaaacc');
    makeSign('D3 ICE CAVERNS', 410, -160, '#88ccff');

    // Player — south edge (from central hub north warp)
    const player = SpriteSystemV3.createPlayer(loader, {
      position: { x: 0, y: 0, z: ZONE_L * 0.4 }
    });
    scene.add(player.mesh);

    // Fixed mountain enemies (use available sprites)
    const fixedEnemies = [];
    function placeEnemy(path, x, z) {
      const e = SpriteSystemV3.createEnemy(path, loader, {
        position: { x: x, y: 0, z: z },
        width: 44, height: 44
      });
      e.mesh.position.y = terrain.getHeight(x, z) + 24;
      scene.add(e.mesh);
      fixedEnemies.push(e);
      return e;
    }
    placeEnemy('assets/enemies/SLIME-1-0.png', -280, -400);
    placeEnemy('assets/enemies/SLIME-1-0.png', 320, -520);
    placeEnemy('assets/enemies/NEONSKULL-1.png', -120, -600);
    placeEnemy('assets/enemies/GHOSTHARDL.png', 180, -680);
    placeEnemy('assets/enemies/NEONSKULL-1.png', -480, -300);
    placeEnemy('assets/enemies/GHOSTHARDR.png', 500, -350);

    const hpBars = HpBarSystemV3.create(scene, loader);
    hpBars.attach(player.mesh, { type: 'player', max: 6, current: 6, offsetY: 52 });
    fixedEnemies.forEach(function (e) {
      hpBars.attach(e.mesh, { type: 'enemy', max: 3, current: 3, offsetY: 42 });
    });

    const lanternLight = new THREE.PointLight(0xffcc66, 0, 280, 2);
    lanternLight.position.set(0, 30, 0);
    player.mesh.add(lanternLight);

    const inventory = InventorySystemV3.create({
      lanternLight: lanternLight,
      starter: ['woodsword', 'lantern', 'musicnote'],
      onSong: function () { flash('A cold wind carries the melody...'); },
      onLantern: function (on) { flash(on ? 'Lantern ON' : 'Lantern OFF'); }
    });
    inventory.equip('woodsword');

    const nightSpawn = NightSpawnV3.create({
      scene: scene,
      loader: loader,
      player: player,
      enemyPaths: [
        'assets/enemies/GHOSTHARDL.png',
        'assets/enemies/GHOSTHARDR.png',
        'assets/enemies/NEONSKULL-1.png',
        'assets/enemies/BOOEY-1-0.png'
      ],
      getHour: function () { return sky.getHour(); },
      getHeight: function (x, z) { return terrain.getHeight(x, z); },
      maxAlive: 7,
      spawnInterval: 4.0,
      radiusMin: 180,
      radiusMax: 420
    });

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = true;
      if (k === 'q') inventory.use();
      if (k === 'e') {
        const tools = inventory.list();
        if (tools.length) {
          const cur = inventory.getEquipped();
          const i = Math.max(0, tools.indexOf(cur));
          inventory.equip(tools[(i + 1) % tools.length]);
          flash('Equipped: ' + inventory.getEquipped());
        }
      }
      if (k === '2') { inventory.equip('lantern'); inventory.use('lantern'); }
      if (k === '3') { inventory.equip('musicnote'); inventory.use('musicnote'); }
      if (e.code === 'Escape') window.location.href = 'index.html';
      if (k === 'f') tryInteract();
    });
    window.addEventListener('keyup', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = false;
    });

    function tryInteract() {
      const p = player.mesh.position;
      // Factory door → industrial sector
      if (Math.abs(p.x - FX) < 40 && Math.abs(p.z - (FZ + 70)) < 45) {
        window.location.href = 'secret_factory_2.html';
        return;
      }
      // D3 Ice Caverns
      if (Math.abs(p.x - 410) < 40 && Math.abs(p.z + 200) < 40) {
        window.location.href = 'd_3.html';
        return;
      }
    }

    function collides(x, z, rad) {
      rad = rad || 16;
      for (const b of room.solidBoxes) {
        if (x + rad > b.minX && x - rad < b.maxX &&
            z + rad > b.minZ && z - rad < b.maxZ) return true;
      }
      return false;
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = 1 / 60;

      sky.update(dt, {
        camera: camera,
        sun: scene.getObjectByName('terrain-sun'),
        ambient: scene.children.filter(function (c) { return c.isAmbientLight; })[0],
        fog: scene.fog,
        background: scene.background
      });
      clock.setHour(sky.getHour());

      let moving = false;
      let dir = player.getDirection ? player.getDirection() : 'down';
      const speed = 4.4;
      const pos = player.mesh.position;
      let nx = pos.x, nz = pos.z;
      if (keys.w) { nz -= speed; dir = 'up'; moving = true; }
      if (keys.s) { nz += speed; dir = 'down'; moving = true; }
      if (keys.a) { nx -= speed; if (!moving) dir = 'left'; moving = true; }
      if (keys.d) { nx += speed; if (!moving) dir = 'right'; moving = true; }
      if (!collides(nx, pos.z)) pos.x = nx;
      if (!collides(pos.x, nz)) pos.z = nz;

      const halfW = ZONE_W * 0.48, halfL = ZONE_L * 0.48;
      pos.x = Math.max(-halfW, Math.min(halfW, pos.x));
      pos.z = Math.max(-halfL, Math.min(halfL, pos.z));
      pos.y = terrain.getHeight(pos.x, pos.z) + 22;

      // Warps
      if (pos.z > halfL - 30) { window.location.href = 'index.html'; return; } // south → hub
      if (pos.z < -halfL + 30) { window.location.href = 'industrial_sector.html'; return; } // north deeper
      if (pos.x > halfW - 20) { window.location.href = 'east_sector.html'; return; }

      if (Math.abs(pos.x - FX) < 50 && Math.abs(pos.z - (FZ + 70)) < 50) {
        hudSub.textContent = '[ F — ENTER FACTORY / INDUSTRIAL ]';
      } else if (Math.abs(pos.x - 410) < 45 && Math.abs(pos.z + 200) < 45) {
        hudSub.textContent = '[ F — ENTER D3 ICE CAVERNS ]';
      } else {
        hudSub.textContent = 'WASD · F · SOUTH=HUB · ICE CAVERNS · N=FACTORY';
      }

      if (player.setDirection) player.setDirection(dir);
      if (player.setMoving) player.setMoving(moving);
      if (player.update) player.update();
      if (player.faceCamera) player.faceCamera(camera);

      fixedEnemies.forEach(function (e) {
        e.mesh.position.y = terrain.getHeight(e.mesh.position.x, e.mesh.position.z) + 24;
        if (e.faceCamera) e.faceCamera(camera);
      });

      nightSpawn.update(dt);
      nightSpawn.faceCamera(camera);
      nightSpawn.getEnemies().forEach(function (e) {
        if (e.mesh && !e.mesh.userData.hpBar) {
          hpBars.attach(e.mesh, { type: 'enemy', max: 3, current: 3, offsetY: 42 });
        }
      });
      hpBars.update(camera);

      props.forEach(function (m) {
        m.lookAt(camera.position.x, m.position.y, camera.position.z);
      });
      RoomBuilderV3.faceBillboards(room, camera);

      camera.position.set(pos.x, pos.y + 100, pos.z + 210);
      camera.lookAt(pos.x, pos.y + 18, pos.z - 40);

      statusEl.textContent =
        'X:' + pos.x.toFixed(0) + ' Z:' + pos.z.toFixed(0) +
        ' | Field:' + nightSpawn.getEnemies().length +
        ' | ' + clock.getPhase() + ' | Snow Mountains';

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();
  </script>
</body>
</html>

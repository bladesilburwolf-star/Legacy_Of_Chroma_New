<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neondromeda - D3 Ice Caverns</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #020810; color: #a8d8ff; font-family: monospace; }
    #hud {
      position: absolute; top: 20px; left: 20px; z-index: 20;
      background: rgba(0, 8, 20, 0.9); border: 2px solid #88bbff; padding: 10px 14px;
    }
    #hud .sub { font-size: 11px; color: #6a8ab0; margin-top: 4px; }
    #status {
      position: absolute; bottom: 16px; left: 20px; z-index: 20;
      font-size: 11px; color: #6688aa; background: rgba(0,0,0,0.75); padding: 5px 10px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>D3 // ICE CAVERNS</div>
    <div class="sub">WASD MOVE · ESC / SOUTH = SNOW MOUNTAINS</div>
  </div>
  <div id="status">Loading Ice Caverns...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/engine/Three_js_system/room_builder_v3.js"></script>
  <script src="src/engine/Three_js_system/sprite_system_v3.js"></script>

  <script>
  (function () {
    const MAP_W = 960, MAP_D = 720;
    const FLOOR_Y = RoomBuilderV3.FLOOR_Y;
    const statusEl = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040c18);
    scene.fog = new THREE.FogExp2(0x040c18, 0.0018);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const loader = new THREE.TextureLoader();
    function prep(tex) {
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      tex.generateMipmaps = false;
      return tex;
    }

    // Real D3 floor art
    const floorTex = prep(loader.load('assets/d3/D3 FLOORS.jpg'));
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(MAP_W, MAP_D),
      new THREE.MeshBasicMaterial({ map: floorTex, side: THREE.DoubleSide })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = FLOOR_Y;
    scene.add(floor);

    // Wall mask overlay (visual)
    const wallsTex = prep(loader.load('assets/d3/D3 WALLS.png'));
    const wallsDecal = new THREE.Mesh(
      new THREE.PlaneGeometry(MAP_W, MAP_D),
      new THREE.MeshBasicMaterial({
        map: wallsTex, transparent: true, depthWrite: false, side: THREE.DoubleSide
      })
    );
    wallsDecal.rotation.x = -Math.PI / 2;
    wallsDecal.position.set(0, FLOOR_Y + 0.8, 0);
    scene.add(wallsDecal);

    // Boundary collision (mask-derived rects can replace later)
    const S = RoomBuilderV3.shape;
    const wallC = '#1a3050';
    const shapes = [
      S({ id: 'n', layer: 'L2', geo: 'Cube', scale: { x: MAP_W, y: 80, z: 28 }, sizeZ: 28,
        position: { x: 0, y: 40, z: -MAP_D/2 + 14 }, color: wallC, solid: true }),
      S({ id: 's1', layer: 'L2', geo: 'Cube', scale: { x: MAP_W * 0.35, y: 80, z: 28 }, sizeZ: 28,
        position: { x: -MAP_W * 0.32, y: 40, z: MAP_D/2 - 14 }, color: wallC, solid: true }),
      S({ id: 's2', layer: 'L2', geo: 'Cube', scale: { x: MAP_W * 0.35, y: 80, z: 28 }, sizeZ: 28,
        position: { x: MAP_W * 0.32, y: 40, z: MAP_D/2 - 14 }, color: wallC, solid: true }),
      S({ id: 'w', layer: 'L2', geo: 'Cube', scale: { x: 28, y: 80, z: MAP_D }, sizeZ: MAP_D,
        position: { x: -MAP_W/2 + 14, y: 40, z: 0 }, color: wallC, solid: true }),
      S({ id: 'e', layer: 'L2', geo: 'Cube', scale: { x: 28, y: 80, z: MAP_D }, sizeZ: MAP_D,
        position: { x: MAP_W/2 - 14, y: 40, z: 0 }, color: wallC, solid: true }),
    ];
    const room = RoomBuilderV3.build(scene, shapes, {
      layerZ: { L1: 0, L2: 0, L3: 0, L4: 0, UI: 0 }
    });

    scene.add(new THREE.AmbientLight(0x6080a0, 0.65));
    const iceLight = new THREE.PointLight(0x88ccff, 0.9, 420);
    iceLight.position.set(0, 70, -40);
    scene.add(iceLight);

    // Exit sign
    const c = document.createElement('canvas');
    c.width = 288; c.height = 48;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 288, 48);
    ctx.strokeStyle = '#88bbff'; ctx.lineWidth = 2; ctx.strokeRect(2, 2, 284, 44);
    ctx.fillStyle = '#88bbff'; ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('EXIT → SNOW', 144, 24);
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(90, 16),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, side: THREE.DoubleSide })
    );
    sign.position.set(0, FLOOR_Y + 38, MAP_D/2 - 42);
    scene.add(sign);

    // Boss door north (placeholder → d_3boss later)
    const bossC = document.createElement('canvas');
    bossC.width = 256; bossC.height = 48;
    const bctx = bossC.getContext('2d');
    bctx.fillStyle = '#000'; bctx.fillRect(0, 0, 256, 48);
    bctx.strokeStyle = '#aaddff'; bctx.strokeRect(2, 2, 252, 44);
    bctx.fillStyle = '#aaddff'; bctx.font = 'bold 16px monospace';
    bctx.textAlign = 'center'; bctx.textBaseline = 'middle';
    bctx.fillText('BOSS SEALED', 128, 24);
    const bossSign = new THREE.Mesh(
      new THREE.PlaneGeometry(70, 14),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(bossC), transparent: true, side: THREE.DoubleSide })
    );
    bossSign.position.set(0, FLOOR_Y + 40, -MAP_D/2 + 50);
    scene.add(bossSign);

    const player = SpriteSystemV3.createPlayer(loader, {
      position: { x: 0, y: 0, z: MAP_D/2 - 90 }
    });
    scene.add(player.mesh);

    // A few ice-themed enemies
    const enemies = [];
    function placeEnemy(path, x, z) {
      const e = SpriteSystemV3.createEnemy(path, loader, {
        position: { x: x, y: 0, z: z }, width: 40, height: 40
      });
      scene.add(e.mesh);
      enemies.push(e);
    }
    placeEnemy('assets/enemies/SLIME-1-0.png', -120, 0);
    placeEnemy('assets/enemies/SLIME-1-0.png', 140, -80);
    placeEnemy('assets/enemies/GHOSTHARDL.png', 0, -200);

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = true;
      if (e.code === 'Escape') window.location.href = 'secret_factory.html';
    });
    window.addEventListener('keyup', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = false;
    });

    function collides(x, z, rad) {
      rad = rad || 16;
      for (const b of room.solidBoxes) {
        if (x + rad > b.minX && x - rad < b.maxX &&
            z + rad > b.minZ && z - rad < b.maxZ) return true;
      }
      return false;
    }

    function animate() {
      requestAnimationFrame(animate);
      let moving = false, dir = 'down';
      const speed = 3.4, pos = player.mesh.position;
      let nx = pos.x, nz = pos.z;
      if (keys.w) { nz -= speed; dir = 'up'; moving = true; }
      if (keys.s) { nz += speed; dir = 'down'; moving = true; }
      if (keys.a) { nx -= speed; if (!moving) dir = 'left'; moving = true; }
      if (keys.d) { nx += speed; if (!moving) dir = 'right'; moving = true; }
      if (!collides(nx, pos.z)) pos.x = nx;
      if (!collides(pos.x, nz)) pos.z = nz;
      pos.x = Math.max(-MAP_W/2 + 40, Math.min(MAP_W/2 - 40, pos.x));
      pos.z = Math.max(-MAP_D/2 + 40, Math.min(MAP_D/2 - 30, pos.z));

      if (pos.z > MAP_D/2 - 50 && Math.abs(pos.x) < 90) {
        window.location.href = 'secret_factory.html';
        return;
      }

      if (player.setDirection) player.setDirection(dir);
      if (player.setMoving) player.setMoving(moving);
      if (player.update) player.update();
      if (player.faceCamera) player.faceCamera(camera);
      enemies.forEach(function (e) { if (e.faceCamera) e.faceCamera(camera); });
      sign.lookAt(camera.position.x, sign.position.y, camera.position.z);
      bossSign.lookAt(camera.position.x, bossSign.position.y, camera.position.z);
      RoomBuilderV3.faceBillboards(room, camera);

      camera.position.set(pos.x, pos.y + 90, pos.z + 140);
      camera.lookAt(pos.x, pos.y + 12, pos.z - 30);
      statusEl.textContent = 'D3 Ice X:' + pos.x.toFixed(0) + ' Z:' + pos.z.toFixed(0);
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();
  </script>
</body>
</html>

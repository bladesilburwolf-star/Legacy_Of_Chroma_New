<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neondromeda - D7 Secret Factory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; color: #00ff66; font-family: monospace; }
    #hud {
      position: absolute; top: 20px; left: 20px; z-index: 20;
      background: rgba(0,0,0,0.85); border: 2px solid #00ff66; padding: 10px 14px;
    }
    #status {
      position: absolute; bottom: 16px; left: 20px; z-index: 20;
      font-size: 11px; color: #668; background: rgba(0,0,0,0.75); padding: 5px 10px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>D7 // SECRET FACTORY INTERIOR</div>
    <div style="font-size:11px;color:#6a8;margin-top:4px;">WASD MOVE · ESC / SOUTH = INDUSTRIAL</div>
  </div>
  <div id="status">Loading D7...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/engine/Three_js_system/room_builder_v3.js"></script>
  <script src="src/engine/Three_js_system/sprite_system_v3.js"></script>

  <script>
  (function () {
    // Former side-scroller map → top-down floor for factory dungeon
    const MAP_W = 960, MAP_D = 720;
    const FLOOR_Y = RoomBuilderV3.FLOOR_Y;
    const statusEl = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020806);
    scene.fog = new THREE.FogExp2(0x020806, 0.002);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const loader = new THREE.TextureLoader();
    function prep(tex) {
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      tex.generateMipmaps = false;
      return tex;
    }

    const floorTex = prep(loader.load('assets/d7/D7 FLOORS.jpg'));
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(MAP_W, MAP_D),
      new THREE.MeshBasicMaterial({ map: floorTex, side: THREE.DoubleSide })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = FLOOR_Y;
    scene.add(floor);

    // Boundary walls (full mask collision later)
    const S = RoomBuilderV3.shape;
    const wallC = '#1a3a2a';
    const shapes = [
      S({ id: 'n', layer: 'L2', geo: 'Cube', scale: { x: MAP_W, y: 80, z: 24 }, sizeZ: 24,
        position: { x: 0, y: 40, z: -MAP_D/2 + 12 }, color: wallC, solid: true }),
      S({ id: 's', layer: 'L2', geo: 'Cube', scale: { x: MAP_W * 0.4, y: 80, z: 24 }, sizeZ: 24,
        position: { x: -MAP_W * 0.3, y: 40, z: MAP_D/2 - 12 }, color: wallC, solid: true }),
      S({ id: 's2', layer: 'L2', geo: 'Cube', scale: { x: MAP_W * 0.4, y: 80, z: 24 }, sizeZ: 24,
        position: { x: MAP_W * 0.3, y: 40, z: MAP_D/2 - 12 }, color: wallC, solid: true }),
      S({ id: 'w', layer: 'L2', geo: 'Cube', scale: { x: 24, y: 80, z: MAP_D }, sizeZ: MAP_D,
        position: { x: -MAP_W/2 + 12, y: 40, z: 0 }, color: wallC, solid: true }),
      S({ id: 'e', layer: 'L2', geo: 'Cube', scale: { x: 24, y: 80, z: MAP_D }, sizeZ: MAP_D,
        position: { x: MAP_W/2 - 12, y: 40, z: 0 }, color: wallC, solid: true }),
    ];
    const room = RoomBuilderV3.build(scene, shapes, {
      layerZ: { L1: 0, L2: 0, L3: 0, L4: 0, UI: 0 }
    });

    scene.add(new THREE.AmbientLight(0x406050, 0.7));
    const lamp = new THREE.PointLight(0x44ff88, 0.8, 400);
    lamp.position.set(0, 80, 0);
    scene.add(lamp);

    // Exit sign south
    const c = document.createElement('canvas');
    c.width = 256; c.height = 48;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 256, 48);
    ctx.strokeStyle = '#00ff66'; ctx.strokeRect(2, 2, 252, 44);
    ctx.fillStyle = '#00ff66'; ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('EXIT → INDUSTRIAL', 128, 24);
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 16),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, side: THREE.DoubleSide })
    );
    sign.position.set(0, FLOOR_Y + 36, MAP_D/2 - 40);
    scene.add(sign);

    const player = SpriteSystemV3.createPlayer(loader, {
      position: { x: 0, y: 0, z: MAP_D/2 - 80 }
    });
    scene.add(player.mesh);

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = true;
      if (e.code === 'Escape') window.location.href = 'secret_factory_2.html';
    });
    window.addEventListener('keyup', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = false;
    });

    function collides(x, z, rad) {
      rad = rad || 16;
      for (const b of room.solidBoxes) {
        if (x + rad > b.minX && x - rad < b.maxX &&
            z + rad > b.minZ && z - rad < b.maxZ) return true;
      }
      return false;
    }

    function animate() {
      requestAnimationFrame(animate);
      let moving = false, dir = 'down';
      const speed = 3.5, pos = player.mesh.position;
      let nx = pos.x, nz = pos.z;
      if (keys.w) { nz -= speed; dir = 'up'; moving = true; }
      if (keys.s) { nz += speed; dir = 'down'; moving = true; }
      if (keys.a) { nx -= speed; if (!moving) dir = 'left'; moving = true; }
      if (keys.d) { nx += speed; if (!moving) dir = 'right'; moving = true; }
      if (!collides(nx, pos.z)) pos.x = nx;
      if (!collides(pos.x, nz)) pos.z = nz;
      pos.x = Math.max(-MAP_W/2 + 40, Math.min(MAP_W/2 - 40, pos.x));
      pos.z = Math.max(-MAP_D/2 + 40, Math.min(MAP_D/2 - 30, pos.z));

      if (pos.z > MAP_D/2 - 50 && Math.abs(pos.x) < 80) {
        window.location.href = 'secret_factory_2.html';
        return;
      }

      if (player.setDirection) player.setDirection(dir);
      if (player.setMoving) player.setMoving(moving);
      if (player.update) player.update();
      if (player.faceCamera) player.faceCamera(camera);
      sign.lookAt(camera.position.x, sign.position.y, camera.position.z);
      RoomBuilderV3.faceBillboards(room, camera);

      camera.position.set(pos.x, pos.y + 90, pos.z + 140);
      camera.lookAt(pos.x, pos.y + 12, pos.z - 30);
      statusEl.textContent = 'D7 X:' + pos.x.toFixed(0) + ' Z:' + pos.z.toFixed(0);
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();
  </script>
</body>
</html>

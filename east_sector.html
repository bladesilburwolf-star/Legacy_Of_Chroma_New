<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neondromeda - East Sector (The Shore)</title>
    <style>
        @font-face {
            font-family: 'RetroCGA';
            src: url('assets/fonts/Px437_IBM_CGA.ttf') format('truetype');
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background: #000;
            color: #ffe066;
            font-family: 'RetroCGA', monospace;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        #hud {
            position: absolute; top: 40px; left: 35px; z-index: 20;
            background: rgba(10, 8, 0, 0.88);
            border: 2px solid #ffcc44;
            padding: 10px 14px;
            max-width: 460px;
        }
        #hud .title { font-size: 13px; letter-spacing: 0.08em; color: #ffcc44; }
        #hud .sub { font-size: 11px; color: #b0a06a; margin-top: 4px; }
        #status {
            position: absolute; bottom: 18px; left: 35px; z-index: 20;
            font-size: 11px; color: #8a7a4a;
            background: rgba(0,0,0,0.75);
            padding: 5px 10px;
            border: 1px solid #443622;
        }
        .scanlines {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom, transparent 0, transparent 2px,
                rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 3px
            );
            mix-blend-mode: multiply;
        }
        #msg {
            display: none;
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            background: rgba(10,8,0,0.95);
            border: 2px solid #ffcc44;
            padding: 20px 32px;
            text-align: center;
            color: #ffe8b0;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="scanlines"></div>
    <div id="hud">
        <div class="title">EAST SECTOR // THE SHORE</div>
        <div class="sub" id="hud-sub">WASD MOVE &middot; F INTERACT &middot; Q USE &middot; E CYCLE &middot; WEST = HUB</div>
    </div>
    <div id="msg"><div id="msg-text"></div></div>
    <div id="status">Loading East Sector...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="src/engine/Three_js_system/room_builder_v3.js"></script>
    <script src="src/engine/Three_js_system/sprite_system_v3.js"></script>
    <script src="src/engine/Three_js_system/terrain_generator_v3.js"></script>
    <script src="src/engine/Three_js_system/heightmap_generator_v3.js"></script>
    <script src="src/engine/Three_js_system/normalmap_generator_v3.js"></script>
    <script src="src/engine/Three_js_system/skybox_system_v3.js"></script>
    <script src="src/engine/Three_js_system/clock_system_v3.js"></script>
    <script src="src/engine/Three_js_system/night_spawn_v3.js"></script>
    <script src="src/engine/Three_js_system/hp_bar_system_v3.js"></script>
    <script src="src/engine/Three_js_system/inventory_system_v3.js"></script>

    <script>
    (function () {
        const statusEl = document.getElementById('status');
        const hudSub = document.getElementById('hud-sub');
        const msgEl = document.getElementById('msg');
        const msgText = document.getElementById('msg-text');

        function flash(text, ms) {
            msgText.textContent = text;
            msgEl.style.display = 'block';
            setTimeout(function () { msgEl.style.display = 'none'; }, ms || 1800);
        }

        // East sector size — wide open shoreline, ocean along the east edge
        const ZONE_W = 2000;
        const ZONE_L = 2400;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x203a4a);
        scene.fog = new THREE.FogExp2(0x203a4a, 0.0008);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 9000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const loader = new THREE.TextureLoader();
        function prep(tex) {
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            tex.generateMipmaps = false;
            return tex;
        }

        // Sky + clock
        const sky = SkyboxSystemV3.create(scene, {
            radius: Math.max(ZONE_L, ZONE_W) * 1.5,
            cycleMinutes: 8,
            startHour: 14,
            loader: loader,
            dayFog: 0x4a7a9a,
            nightFog: 0x040a14
        });
        const clock = ClockSystemV3.create({ x: 35, y: 40, hour: 14 });

        // Terrain — mostly flat sand, gentle dune roll, flattened at the
        // three approach points (hub entry, cave-mouth approach, and a
        // clear waterline strip so the shore doesn't look jagged against
        // the ocean plane).
        const TERRAIN_RES = 80;
        const hm = HeightmapGeneratorV3.create({ resolution: TERRAIN_RES, seed: 214 });
        hm.fbm({ scale: 5.5, octaves: 4 });
        hm.flattenCircle(0.06, 0.5, 0.10, 0.03);  // west entry from hub
        hm.flattenCircle(0.5, 0.08, 0.10, 0.04);  // north cave-mouth approach
        hm.flattenCircle(0.85, 0.5, 0.22, 0.02);  // waterline strip, low + flat
        const heights = hm.getFloats();
        const nrmBake = NormalmapGeneratorV3.fromHeightmap(hm, { strength: 1.4 });
        const terrain = TerrainGeneratorV3.createFromHeights(scene, heights, {
            resolution: TERRAIN_RES,
            sizeX: ZONE_W,
            sizeZ: ZONE_L,
            maxHeight: 55, // dunes are much gentler than West Sector's hills
            floorY: RoomBuilderV3.FLOOR_Y
        });
        (function applyGround() {
            const sun = new THREE.DirectionalLight(0xffe8b0, 0.85);
            sun.name = 'terrain-sun';
            sun.position.set(200, 380, 150);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0x506878, 0.45));
            const sand = prep(loader.load('assets/textures/sand2.jpg'));
            sand.wrapS = THREE.RepeatWrapping;
            sand.wrapT = THREE.RepeatWrapping;
            sand.repeat.set(ZONE_W / 180, ZONE_L / 180);
            try {
                const mat = new THREE.MeshStandardMaterial({
                    map: sand,
                    normalMap: nrmBake.toTexture(),
                    normalScale: new THREE.Vector2(0.6, 0.6),
                    vertexColors: true,
                    roughness: 0.9,
                    side: THREE.DoubleSide
                });
                terrain.mesh.material.dispose();
                terrain.mesh.material = mat;
            } catch (e) {}
        })();

        // Ocean — flat water plane past the east edge of the playable
        // sand. Not solid, not interactive yet, just the shoreline view.
        const OCEAN_X = ZONE_W * 0.42;
        (function addOcean() {
            const waterTex = prep(loader.load('assets/textures/water1.jpg'));
            waterTex.wrapS = THREE.RepeatWrapping;
            waterTex.wrapT = THREE.RepeatWrapping;
            waterTex.repeat.set(10, 14);
            const mat = new THREE.MeshBasicMaterial({
                map: waterTex, side: THREE.DoubleSide, transparent: true, opacity: 0.92
            });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(ZONE_W * 1.4, ZONE_L * 1.6), mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(OCEAN_X + ZONE_W * 0.4, RoomBuilderV3.FLOOR_Y + 4, 0);
            scene.add(mesh);
        })();

        // Beach props — sparse palm-ish trees (reusing TREE1-1.png, no
        // dedicated palm art yet) + driftwood/boulder clusters, thinner
        // than the West Sector's dense woods.
        const props = [];
        function addProp(path, x, z, w, h) {
            const mat = new THREE.MeshBasicMaterial({
                map: prep(loader.load(path)),
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: true
            });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
            const y = terrain.getHeight(x, z) + h * 0.42;
            mesh.position.set(x, y, z);
            scene.add(mesh);
            props.push(mesh);
            return mesh;
        }
        for (let i = 0; i < 22; i++) {
            const x = -700 + Math.random() * 1100; // keep clear of the ocean edge
            const z = -900 + Math.random() * 1800;
            if (Math.abs(z + 900) < 120) continue; // keep the cave approach clear
            addProp('assets/overworld/TREE1-1.png', x, z, 48 + Math.random() * 18, 58 + Math.random() * 20);
        }
        // Driftwood / rocks scattered near the waterline
        for (let i = 0; i < 10; i++) {
            const x = OCEAN_X - 60 - Math.random() * 200;
            const z = -900 + Math.random() * 1800;
            addProp('assets/overworld/BOULDER-1.png', x, z, 30, 26);
        }

        // Landmarks via RoomBuilder — a rocky cliff with a cave mouth to
        // the north (the path toward the mountains / Arcade 2), plus a
        // small wooden dock at the waterline for atmosphere.
        const S = RoomBuilderV3.shape;
        const CX = 0, CZ = -950; // cave center
        const shapes = [
            // ---- Cliff / cave mouth (north approach to the mountains) ----
            S({ id: 'cliff_l', layer: 'L2', geo: 'Cube',
                scale: { x: 160, y: 130, z: 60 }, sizeZ: 60,
                position: { x: CX - 150, y: 55, z: CZ }, color: '#4a4438', solid: true }),
            S({ id: 'cliff_r', layer: 'L2', geo: 'Cube',
                scale: { x: 160, y: 130, z: 60 }, sizeZ: 60,
                position: { x: CX + 150, y: 55, z: CZ }, color: '#443e32', solid: true }),
            S({ id: 'cliff_top', layer: 'L3', geo: 'Cube',
                scale: { x: 420, y: 40, z: 60 }, sizeZ: 60,
                position: { x: CX, y: 138, z: CZ }, color: '#3e3830', solid: true }),
            // Cave mouth (non-solid dark opening between the two cliff faces)
            S({ id: 'cave_mouth', layer: 'L3', geo: 'Cube',
                scale: { x: 90, y: 70, z: 10 }, sizeZ: 10,
                position: { x: CX, y: 35, z: CZ - 28 }, color: '#0a0806', solid: false }),
            // Boulders flanking the entrance
            S({ id: 'cave_boulder_l', layer: 'L2', geo: 'VCylinder',
                scale: { x: 30, y: 34, z: 30 }, sizeZ: 30,
                position: { x: CX - 70, y: 17, z: CZ + 30 }, color: '#4e4638', solid: true }),
            S({ id: 'cave_boulder_r', layer: 'L2', geo: 'VCylinder',
                scale: { x: 26, y: 30, z: 26 }, sizeZ: 26,
                position: { x: CX + 75, y: 15, z: CZ + 35 }, color: '#484032', solid: true }),

            // ---- Small wooden dock at the waterline (decorative) ----
            S({ id: 'dock_a', layer: 'L1', geo: 'Cube',
                scale: { x: 44, y: 6, z: 160 }, sizeZ: 160,
                position: { x: OCEAN_X - 90, y: 3, z: 250 }, color: '#5a4530', solid: true }),
            S({ id: 'dock_post_1', layer: 'L2', geo: 'VCylinder',
                scale: { x: 8, y: 26, z: 8 }, sizeZ: 8,
                position: { x: OCEAN_X - 108, y: 6, z: 190 }, color: '#3a2c1c', solid: true }),
            S({ id: 'dock_post_2', layer: 'L2', geo: 'VCylinder',
                scale: { x: 8, y: 26, z: 8 }, sizeZ: 8,
                position: { x: OCEAN_X - 72, y: 6, z: 190 }, color: '#3a2c1c', solid: true }),
        ];
        const room = RoomBuilderV3.build(scene, shapes, {
            layerZ: { L1: -40, L2: -10, L3: 0, L4: 20, UI: 40 }
        });

        // Sign textboards
        function makeSign(text, x, z, color) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 64;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 256, 64);
            ctx.strokeStyle = color || '#ffcc44';
            ctx.lineWidth = 3;
            ctx.strokeRect(2, 2, 252, 60);
            ctx.fillStyle = color || '#ffcc44';
            ctx.font = 'bold 22px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 32);
            const mat = new THREE.MeshBasicMaterial({
                map: new THREE.CanvasTexture(c),
                transparent: true,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(80, 20), mat);
            mesh.position.set(x, terrain.getHeight(x, z) + 46, z);
            scene.add(mesh);
            props.push(mesh);
            return mesh;
        }
        makeSign('MOUNTAIN PASS', CX, CZ + 90, '#ffcc44');
        makeSign('← HUB', -880, 0, '#00ff66');
        makeSign('THE SHORE', 200, 700, '#66ccff');

        // Player — enter from the west (from central hub)
        const player = SpriteSystemV3.createPlayer(loader, {
            position: { x: -880, y: 0, z: 0 }
        });
        scene.add(player.mesh);

        // Fixed shoreline creatures — using SLIME-1-0.png as a jellyfish
        // stand-in (no dedicated jellyfish sprite in assets/enemies yet;
        // this is a placeholder, swap in real jellyfish art when it
        // exists rather than treating this as final).
        const fixedEnemies = [];
        function placeEnemy(path, x, z) {
            const e = SpriteSystemV3.createEnemy(path, loader, {
                position: { x: x, y: 0, z: z },
                width: 36, height: 36
            });
            e.mesh.position.y = terrain.getHeight(x, z) + 20;
            scene.add(e.mesh);
            fixedEnemies.push(e);
            return e;
        }
        placeEnemy('assets/enemies/SLIME-1-0.png', OCEAN_X - 180, -300);
        placeEnemy('assets/enemies/SLIME-1-0.png', OCEAN_X - 220, 400);
        placeEnemy('assets/enemies/SLIME-1-0.png', OCEAN_X - 150, 850);

        // HP + inventory
        const hpBars = HpBarSystemV3.create(scene, loader);
        hpBars.attach(player.mesh, { type: 'player', max: 6, current: 6, offsetY: 52 });
        fixedEnemies.forEach(function (e) {
            hpBars.attach(e.mesh, { type: 'enemy', max: 3, current: 3, offsetY: 40 });
        });

        const lanternLight = new THREE.PointLight(0xffcc66, 0, 260, 2);
        lanternLight.position.set(0, 28, 0);
        player.mesh.add(lanternLight);

        const inventory = InventorySystemV3.create({
            lanternLight: lanternLight,
            starter: ['woodsword', 'lantern', 'musicnote'],
            onSong: function () {
                flash('The ocarina\'s melody carries over the waves...');
            },
            onLantern: function (on) {
                flash(on ? 'Lantern ON' : 'Lantern OFF');
            }
        });
        inventory.equip('woodsword');

        // Night field spawns — reusing the same spooky night roster as
        // West Sector since there's no dedicated beach-night creature
        // yet either; SLIME doubles as both the day jellyfish stand-in
        // and part of the night pool here.
        const nightSpawn = NightSpawnV3.create({
            scene: scene,
            loader: loader,
            player: player,
            enemyPaths: [
                'assets/enemies/SLIME-1-0.png',
                'assets/enemies/GHOSTHARDL.png',
                'assets/enemies/GHOSTHARDR.png',
                'assets/enemies/NEONSKULL-1.png'
            ],
            getHour: function () { return sky.getHour(); },
            getHeight: function (x, z) { return terrain.getHeight(x, z); },
            maxAlive: 6,
            spawnInterval: 4.0,
            radiusMin: 150,
            radiusMax: 360
        });

        // Input
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', function (e) {
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = true;
            if (k === 'q') inventory.use();
            if (k === 'e') {
                const tools = inventory.list();
                if (tools.length) {
                    const cur = inventory.getEquipped();
                    const i = Math.max(0, tools.indexOf(cur));
                    inventory.equip(tools[(i + 1) % tools.length]);
                    flash('Equipped: ' + inventory.getEquipped());
                }
            }
            if (k === '2') { inventory.equip('lantern'); inventory.use('lantern'); }
            if (k === '3') { inventory.equip('musicnote'); inventory.use('musicnote'); }
            if (e.code === 'Escape') window.location.href = 'index.html';
            if (k === 'f') tryInteract();
        });
        window.addEventListener('keyup', function (e) {
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = false;
        });

        function tryInteract() {
            const p = player.mesh.position;

        function collides(x, z, rad) {
            rad = rad || 16;
            for (const b of room.solidBoxes) {
                if (x + rad > b.minX && x - rad < b.maxX &&
                    z + rad > b.minZ && z - rad < b.maxZ) return true;
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = 1 / 60;

            sky.update(dt, {
                camera: camera,
                sun: scene.getObjectByName('terrain-sun'),
                ambient: scene.children.filter(function (c) { return c.isAmbientLight; })[0],
                fog: scene.fog,
                background: scene.background
            });
            clock.setHour(sky.getHour());

            // Movement
            let moving = false;
            let dir = player.getDirection ? player.getDirection() : 'down';
            const speed = 4.2;
            const pos = player.mesh.position;
            let nx = pos.x, nz = pos.z;
            if (keys.w) { nz -= speed; dir = 'up'; moving = true; }
            if (keys.s) { nz += speed; dir = 'down'; moving = true; }
            if (keys.a) { nx -= speed; if (!moving) dir = 'left'; moving = true; }
            if (keys.d) { nx += speed; if (!moving) dir = 'right'; moving = true; }
            if (!collides(nx, pos.z)) pos.x = nx;
            if (!collides(pos.x, nz)) pos.z = nz;

            // Soft bounds — east edge stops at the waterline, not the
            // literal ocean plane, so the player can stand at the shore
            // but not wade out into it.
            const halfW = ZONE_W * 0.48, halfL = ZONE_L * 0.48;
            const eastLimit = OCEAN_X - 40;
            pos.x = Math.max(-halfW, Math.min(eastLimit, pos.x));
            pos.z = Math.max(-halfL, Math.min(halfL, pos.z));

            // Terrain snap
            pos.y = terrain.getHeight(pos.x, pos.z) + 22;

            // Warps
            if (pos.x < -halfW + 40) {
                window.location.href = 'index.html';
                return;
            }
            if (Math.abs(pos.x - CX) < 80 && Math.abs(pos.z - (CZ + 20)) < 60) {
                hudSub.textContent = '[ F — ENTER THE MOUNTAIN PASS ]';
            } else if (pos.x > eastLimit - 30) {
                hudSub.textContent = 'The tide is too strong to go further...';
            } else {
                hudSub.textContent = 'WASD MOVE · F INTERACT · Q USE · WEST PATH = HUB';
            }

            if (player.setDirection) player.setDirection(dir);
            if (player.setMoving) player.setMoving(moving);
            if (player.update) player.update();
            if (player.faceCamera) player.faceCamera(camera);

            fixedEnemies.forEach(function (e) {
                e.mesh.position.y = terrain.getHeight(e.mesh.position.x, e.mesh.position.z) + 20;
                if (e.faceCamera) e.faceCamera(camera);
            });

            nightSpawn.update(dt);
            nightSpawn.faceCamera(camera);
            nightSpawn.getEnemies().forEach(function (e) {
                if (e.mesh && !e.mesh.userData.hpBar) {
                    hpBars.attach(e.mesh, { type: 'enemy', max: 3, current: 3, offsetY: 40 });
                }
            });
            hpBars.update(camera);

            props.forEach(function (m) {
                m.lookAt(camera.position.x, m.position.y, camera.position.z);
            });
            RoomBuilderV3.faceBillboards(room, camera);

            camera.position.set(pos.x, pos.y + 95, pos.z + 200);
            camera.lookAt(pos.x, pos.y + 15, pos.z - 40);

            statusEl.textContent =
                'X:' + pos.x.toFixed(0) + ' Z:' + pos.z.toFixed(0) +
                ' | Field:' + nightSpawn.getEnemies().length +
                ' | ' + clock.getPhase() + ' | The Shore';

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    })();
    </script>
</body>
</html>

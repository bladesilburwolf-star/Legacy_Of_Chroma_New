<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neondromeda - North Sector (Industrial)</title>
  <style>
    @font-face { font-family: 'RetroCGA'; src: url('assets/fonts/Px437_IBM_CGA.ttf') format('truetype'); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #0a0e0c; color: #d0e0d0; font-family: 'RetroCGA', monospace; }
    #canvas-container { width: 100vw; height: 100vh; }
    #hud {
      position: absolute; top: 40px; left: 35px; z-index: 20;
      background: rgba(0, 8, 6, 0.9); border: 2px solid #6a8a6a;
      padding: 10px 14px; max-width: 480px;
    }
    #hud .title { font-size: 13px; letter-spacing: 0.08em; }
    #hud .sub { font-size: 11px; color: #7a9a7a; margin-top: 4px; }
    #status {
      position: absolute; bottom: 18px; left: 35px; z-index: 20;
      font-size: 11px; color: #6a8a6a; background: rgba(0,0,0,0.75);
      padding: 5px 10px; border: 1px solid #243;
    }
    #msg {
      display: none; position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%); z-index: 50;
      background: rgba(0,10,6,0.95); border: 2px solid #6a8a6a;
      padding: 20px 32px; text-align: center; color: #c0e0c0;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="hud">
    <div class="title">NORTH SECTOR // INDUSTRIAL</div>
    <div class="sub" id="hud-sub">WASD · F ENTER D7/D8 · SOUTH = SNOW · FURTHER SOUTH = HUB</div>
  </div>
  <div id="msg"><div id="msg-text"></div></div>
  <div id="status">Loading Industrial...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/engine/Three_js_system/room_builder_v3.js"></script>
  <script src="src/engine/Three_js_system/sprite_system_v3.js"></script>
  <script src="src/engine/Three_js_system/terrain_generator_v3.js"></script>
  <script src="src/engine/Three_js_system/heightmap_generator_v3.js"></script>
  <script src="src/engine/Three_js_system/normalmap_generator_v3.js"></script>
  <script src="src/engine/Three_js_system/skybox_system_v3.js"></script>
  <script src="src/engine/Three_js_system/clock_system_v3.js"></script>
  <script src="src/engine/Three_js_system/night_spawn_v3.js"></script>
  <script src="src/engine/Three_js_system/hp_bar_system_v3.js"></script>
  <script src="src/engine/Three_js_system/inventory_system_v3.js"></script>

  <script>
  (function () {
    const statusEl = document.getElementById('status');
    const hudSub = document.getElementById('hud-sub');
    const msgEl = document.getElementById('msg');
    const msgText = document.getElementById('msg-text');
    function flash(t, ms) {
      msgText.textContent = t; msgEl.style.display = 'block';
      setTimeout(function () { msgEl.style.display = 'none'; }, ms || 1600);
    }

    // Industrial landmass (final north overworld area)
    const ZONE_W = 2000;
    const ZONE_L = 2200;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x5a6a6a);
    scene.fog = new THREE.FogExp2(0x5a6a6a, 0.0006);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 9000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const loader = new THREE.TextureLoader();
    function prep(tex) {
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      tex.generateMipmaps = false;
      return tex;
    }

    const sky = SkyboxSystemV3.create(scene, {
      radius: Math.max(ZONE_L, ZONE_W) * 1.5,
      cycleMinutes: 8, startHour: 15, loader: loader,
      dayFog: 0x5a6a6a, nightFog: 0x080808
    });
    const clock = ClockSystemV3.create({ x: 35, y: 40, hour: 15 });

    // Flat industrial pad
    const TERRAIN_RES = 80;
    const hm = HeightmapGeneratorV3.create({ resolution: TERRAIN_RES, seed: 48 });
    hm.fbm({ scale: 5.5, octaves: 3 });
    hm.flattenCircle(0.5, 0.5, 0.28, 0.02);  // D7 factory pad
    hm.flattenCircle(0.5, 0.85, 0.14, 0.03); // south → snow
    hm.flattenCircle(0.35, 0.4, 0.1, 0.02);  // D8 annex pad
    const heights = hm.getFloats();
    const nrmBake = NormalmapGeneratorV3.fromHeightmap(hm, { strength: 1.6 });
    const terrain = TerrainGeneratorV3.createFromHeights(scene, heights, {
      resolution: TERRAIN_RES, sizeX: ZONE_W, sizeZ: ZONE_L,
      maxHeight: 55, floorY: RoomBuilderV3.FLOOR_Y
    });

    (function applyGround() {
      const sun = new THREE.DirectionalLight(0xc8d0c0, 0.7);
      sun.name = 'terrain-sun';
      sun.position.set(150, 350, 100);
      scene.add(sun);
      scene.add(new THREE.AmbientLight(0x405040, 0.45));
      const metal = prep(loader.load('assets/textures/metal1.jpg'));
      metal.wrapS = THREE.RepeatWrapping;
      metal.wrapT = THREE.RepeatWrapping;
      metal.repeat.set(ZONE_W / 140, ZONE_L / 140);
      try {
        const mat = new THREE.MeshStandardMaterial({
          map: metal, normalMap: nrmBake.toTexture(),
          normalScale: new THREE.Vector2(0.9, 0.9),
          vertexColors: true, roughness: 0.85, metalness: 0.25,
          color: 0x6a7a6a, side: THREE.DoubleSide
        });
        terrain.mesh.material.dispose();
        terrain.mesh.material = mat;
      } catch (e) {}
    })();

    // D7 main factory complex (center) + D8 annex (west)
    const S = RoomBuilderV3.shape;
    const D7X = 0, D7Z = -80;
    const D8X = -420, D8Z = -200;
    const shapes = [
      // D7 building
      S({ id: 'd7_floor', layer: 'L1', geo: 'Cube',
        scale: { x: 220, y: 10, z: 160 }, sizeZ: 160,
        position: { x: D7X, y: 6, z: D7Z }, color: '#2a2e32', solid: true }),
      S({ id: 'd7_back', layer: 'L2', geo: 'Cube',
        scale: { x: 220, y: 90, z: 16 }, sizeZ: 16,
        position: { x: D7X, y: 52, z: D7Z - 80 }, color: '#3a4048', solid: true }),
      S({ id: 'd7_l', layer: 'L2', geo: 'Cube',
        scale: { x: 16, y: 90, z: 160 }, sizeZ: 160,
        position: { x: D7X - 110, y: 52, z: D7Z }, color: '#343840', solid: true }),
      S({ id: 'd7_r', layer: 'L2', geo: 'Cube',
        scale: { x: 16, y: 90, z: 160 }, sizeZ: 160,
        position: { x: D7X + 110, y: 52, z: D7Z }, color: '#343840', solid: true }),
      S({ id: 'd7_fl', layer: 'L2', geo: 'Cube',
        scale: { x: 80, y: 90, z: 16 }, sizeZ: 16,
        position: { x: D7X - 70, y: 52, z: D7Z + 80 }, color: '#3a4048', solid: true }),
      S({ id: 'd7_fr', layer: 'L2', geo: 'Cube',
        scale: { x: 80, y: 90, z: 16 }, sizeZ: 16,
        position: { x: D7X + 70, y: 52, z: D7Z + 80 }, color: '#3a4048', solid: true }),
      S({ id: 'd7_lintel', layer: 'L2', geo: 'Cube',
        scale: { x: 60, y: 20, z: 16 }, sizeZ: 16,
        position: { x: D7X, y: 88, z: D7Z + 80 }, color: '#2a2e32', solid: true }),
      S({ id: 'd7_sign', layer: 'L3', geo: 'Cube',
        scale: { x: 80, y: 20, z: 6 }, sizeZ: 6,
        position: { x: D7X, y: 108, z: D7Z + 86 }, color: '#ff5533', solid: false }),
      // D8 annex (parallel / inverted factory)
      S({ id: 'd8_floor', layer: 'L1', geo: 'Cube',
        scale: { x: 140, y: 10, z: 110 }, sizeZ: 110,
        position: { x: D8X, y: 6, z: D8Z }, color: '#1a2a1a', solid: true }),
      S({ id: 'd8_back', layer: 'L2', geo: 'Cube',
        scale: { x: 140, y: 70, z: 12 }, sizeZ: 12,
        position: { x: D8X, y: 42, z: D8Z - 55 }, color: '#2a3a2a', solid: true }),
      S({ id: 'd8_l', layer: 'L2', geo: 'Cube',
        scale: { x: 12, y: 70, z: 110 }, sizeZ: 110,
        position: { x: D8X - 70, y: 42, z: D8Z }, color: '#243424', solid: true }),
      S({ id: 'd8_r', layer: 'L2', geo: 'Cube',
        scale: { x: 12, y: 70, z: 110 }, sizeZ: 110,
        position: { x: D8X + 70, y: 42, z: D8Z }, color: '#243424', solid: true }),
      S({ id: 'd8_fl', layer: 'L2', geo: 'Cube',
        scale: { x: 48, y: 70, z: 12 }, sizeZ: 12,
        position: { x: D8X - 46, y: 42, z: D8Z + 55 }, color: '#2a3a2a', solid: true }),
      S({ id: 'd8_fr', layer: 'L2', geo: 'Cube',
        scale: { x: 48, y: 70, z: 12 }, sizeZ: 12,
        position: { x: D8X + 46, y: 42, z: D8Z + 55 }, color: '#2a3a2a', solid: true }),
      S({ id: 'd8_sign', layer: 'L3', geo: 'Cube',
        scale: { x: 60, y: 16, z: 6 }, sizeZ: 6,
        position: { x: D8X, y: 80, z: D8Z + 58 }, color: '#44ff66', solid: false }),
    ];
    const room = RoomBuilderV3.build(scene, shapes, {
      layerZ: { L1: -20, L2: 0, L3: 10, L4: 20, UI: 40 }
    });

    const props = [];
    function makeSign(text, x, z, color) {
      const c = document.createElement('canvas');
      c.width = 320; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 320, 64);
      ctx.strokeStyle = color || '#6a8a6a'; ctx.lineWidth = 3;
      ctx.strokeRect(2, 2, 316, 60);
      ctx.fillStyle = color || '#6a8a6a';
      ctx.font = 'bold 20px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 160, 32);
      const mat = new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(c), transparent: true, side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(100, 20), mat);
      mesh.position.set(x, terrain.getHeight(x, z) + 48, z);
      scene.add(mesh); props.push(mesh);
      return mesh;
    }
    makeSign('D7 SECRET FACTORY', D7X, D7Z + 100, '#ff6644');
    makeSign('D8 PARALLEL', D8X, D8Z + 80, '#44ff66');
    makeSign('→ SNOW SOUTH', 0, ZONE_L * 0.4, '#8ab4d4');

    // Boulders as crates
    function addProp(path, x, z, w, h) {
      const mat = new THREE.MeshBasicMaterial({
        map: prep(loader.load(path)), transparent: true, side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      mesh.position.set(x, terrain.getHeight(x, z) + h * 0.42, z);
      scene.add(mesh); props.push(mesh);
    }
    [[120, 40], [-140, 60], [180, -20], [-90, -50]].forEach(function (p) {
      addProp('assets/overworld/BOULDER-1.png', p[0], p[1], 32, 28);
    });

    const player = SpriteSystemV3.createPlayer(loader, {
      position: { x: 0, y: 0, z: ZONE_L * 0.38 }
    });
    scene.add(player.mesh);

    const fixedEnemies = [];
    function placeEnemy(path, x, z) {
      const e = SpriteSystemV3.createEnemy(path, loader, {
        position: { x: x, y: 0, z: z }, width: 40, height: 40
      });
      e.mesh.position.y = terrain.getHeight(x, z) + 22;
      scene.add(e.mesh); fixedEnemies.push(e);
    }
    placeEnemy('assets/enemies/NEONSKULL-1.png', -160, 20);
    placeEnemy('assets/enemies/NEONSKULL-1.png', 160, 20);
    placeEnemy('assets/enemies/GHOSTHARDL.png', -60, -110);
    placeEnemy('assets/enemies/GHOSTHARDR.png', 80, 90);

    const hpBars = HpBarSystemV3.create(scene, loader);
    hpBars.attach(player.mesh, { type: 'player', max: 6, current: 6, offsetY: 52 });
    fixedEnemies.forEach(function (e) {
      hpBars.attach(e.mesh, { type: 'enemy', max: 3, current: 3, offsetY: 42 });
    });

    const lanternLight = new THREE.PointLight(0xffcc66, 0, 280, 2);
    lanternLight.position.set(0, 30, 0);
    player.mesh.add(lanternLight);
    const inventory = InventorySystemV3.create({
      lanternLight: lanternLight,
      starter: ['woodsword', 'lantern', 'musicnote'],
      onSong: function () { flash('Factory systems resonate...'); },
      onLantern: function (on) { flash(on ? 'Lantern ON' : 'Lantern OFF'); }
    });
    inventory.equip('woodsword');

    const nightSpawn = NightSpawnV3.create({
      scene: scene, loader: loader, player: player,
      enemyPaths: [
        'assets/enemies/NEONSKULL-1.png',
        'assets/enemies/GHOSTHARDL.png',
        'assets/enemies/BOOEY-1-0.png'
      ],
      getHour: function () { return sky.getHour(); },
      getHeight: function (x, z) { return terrain.getHeight(x, z); },
      maxAlive: 5, spawnInterval: 4.5, radiusMin: 160, radiusMax: 380
    });

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = true;
      if (k === 'q') inventory.use();
      if (k === 'e') {
        const tools = inventory.list();
        if (tools.length) {
          const cur = inventory.getEquipped();
          const i = Math.max(0, tools.indexOf(cur));
          inventory.equip(tools[(i + 1) % tools.length]);
        }
      }
      if (k === '2') { inventory.equip('lantern'); inventory.use('lantern'); }
      if (k === '3') { inventory.equip('musicnote'); inventory.use('musicnote'); }
      if (e.code === 'Escape') window.location.href = 'secret_factory.html';
      if (k === 'f') tryInteract();
    });
    window.addEventListener('keyup', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = false;
    });

    function tryInteract() {
      const p = player.mesh.position;
      // D7 door
      if (Math.abs(p.x - D7X) < 40 && Math.abs(p.z - (D7Z + 90)) < 40) {
        window.location.href = 'd_7.html';
        return;
      }
      // D8 door
      if (Math.abs(p.x - D8X) < 40 && Math.abs(p.z - (D8Z + 65)) < 40) {
        window.location.href = 'd_8.html';
        return;
      }
    }

    function collides(x, z, rad) {
      rad = rad || 16;
      for (const b of room.solidBoxes) {
        if (x + rad > b.minX && x - rad < b.maxX &&
            z + rad > b.minZ && z - rad < b.maxZ) return true;
      }
      return false;
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = 1 / 60;
      sky.update(dt, {
        camera: camera,
        sun: scene.getObjectByName('terrain-sun'),
        ambient: scene.children.filter(function (c) { return c.isAmbientLight; })[0],
        fog: scene.fog, background: scene.background
      });
      clock.setHour(sky.getHour());

      let moving = false, dir = 'down';
      const speed = 4.4, pos = player.mesh.position;
      let nx = pos.x, nz = pos.z;
      if (keys.w) { nz -= speed; dir = 'up'; moving = true; }
      if (keys.s) { nz += speed; dir = 'down'; moving = true; }
      if (keys.a) { nx -= speed; if (!moving) dir = 'left'; moving = true; }
      if (keys.d) { nx += speed; if (!moving) dir = 'right'; moving = true; }
      if (!collides(nx, pos.z)) pos.x = nx;
      if (!collides(pos.x, nz)) pos.z = nz;
      const halfW = ZONE_W * 0.48, halfL = ZONE_L * 0.48;
      pos.x = Math.max(-halfW, Math.min(halfW, pos.x));
      pos.z = Math.max(-halfL, Math.min(halfL, pos.z));
      pos.y = terrain.getHeight(pos.x, pos.z) + 22;

      if (pos.z > halfL - 30) { window.location.href = 'secret_factory.html'; return; }
      if (pos.x < -halfW + 20) { window.location.href = 'road_1.html'; return; }
      if (pos.x > halfW - 20) { window.location.href = 'road_2.html'; return; }

      if (Math.abs(pos.x - D7X) < 50 && Math.abs(pos.z - (D7Z + 90)) < 50) {
        hudSub.textContent = '[ F — ENTER D7 SECRET FACTORY ]';
      } else if (Math.abs(pos.x - D8X) < 50 && Math.abs(pos.z - (D8Z + 65)) < 50) {
        hudSub.textContent = '[ F — ENTER D8 PARALLEL WORLD ]';
      } else {
        hudSub.textContent = 'WASD · F D7/D8 · SOUTH = SNOW MOUNTAINS';
      }

      if (player.setDirection) player.setDirection(dir);
      if (player.setMoving) player.setMoving(moving);
      if (player.update) player.update();
      if (player.faceCamera) player.faceCamera(camera);
      fixedEnemies.forEach(function (e) {
        e.mesh.position.y = terrain.getHeight(e.mesh.position.x, e.mesh.position.z) + 22;
        if (e.faceCamera) e.faceCamera(camera);
      });
      nightSpawn.update(dt);
      nightSpawn.faceCamera(camera);
      nightSpawn.getEnemies().forEach(function (e) {
        if (e.mesh && !e.mesh.userData.hpBar) {
          hpBars.attach(e.mesh, { type: 'enemy', max: 3, current: 3, offsetY: 42 });
        }
      });
      hpBars.update(camera);
      props.forEach(function (m) {
        m.lookAt(camera.position.x, m.position.y, camera.position.z);
      });
      RoomBuilderV3.faceBillboards(room, camera);
      camera.position.set(pos.x, pos.y + 100, pos.z + 210);
      camera.lookAt(pos.x, pos.y + 18, pos.z - 40);
      statusEl.textContent =
        'X:' + pos.x.toFixed(0) + ' Z:' + pos.z.toFixed(0) +
        ' | ' + clock.getPhase() + ' | Industrial';
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();
  </script>
</body>
</html>

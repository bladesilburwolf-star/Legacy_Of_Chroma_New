<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy of Chroma - Tomb Dungeon 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #050805; color: #88cc88; font-family: monospace; }
    #hud {
      position: absolute; top: 14px; left: 14px; z-index: 20;
      background: rgba(0,10,0,0.88); border: 2px solid #4a8a4a; padding: 10px 14px;
      max-width: 380px;
    }
    #hud .title { color: #a8ff88; letter-spacing: 0.08em; }
    #hud .sub { font-size: 11px; color: #6a9a6a; margin-top: 4px; }
    #status {
      position: absolute; bottom: 12px; left: 14px; z-index: 20;
      font-size: 11px; background: rgba(0,0,0,0.75); padding: 6px 10px; border: 1px solid #3a6a3a;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="title">TOMB DUNGEON // D1</div>
    <div class="sub">SFPaint palace · scaled · WASD · ARROWS cam · F interact · ESC field</div>
  </div>
  <div id="status">Loading map…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/engine/Three_js_system/room_builder_v3.js"></script>
  <script src="src/engine/Three_js_system/sprite_system_v3.js"></script>
  <script src="src/engine/Three_js_system/camera_controls_v3.js"></script>
  <script src="src/engine/Three_js_system/player_state_v3.js"></script>
  <!-- Prefer external module; inline fallback if 404 -->
  <script src="src/engine/Three_js_system/sfmap_loader_v3.js"></script>
  <script>
  /* If external loader 404s, show clear error */
  if (typeof SFMapLoaderV3 === 'undefined') {
    console.error('sfmap_loader_v3.js missing — copy to src/engine/Three_js_system/');
    document.getElementById('status').textContent = 'Missing sfmap_loader_v3.js';
  }
  </script>

  <script>
  (function () {
    const statusEl = document.getElementById('status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080c08);
    scene.fog = new THREE.FogExp2(0x080c08, 0.0011);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 4000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x668866, 0.75));
    const hemi = new THREE.HemisphereLight(0xaaccff, 0x223322, 0.45);
    scene.add(hemi);
    const torch = new THREE.PointLight(0xffcc88, 1.2, 520);
    scene.add(torch);
    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(80, 200, 120);
    scene.add(fill);

    const loader = new THREE.TextureLoader();
    const keys = { w: false, a: false, s: false, d: false };
    let player, camCtrl, solids = [], exitZone = null;

    const mapUrls = [
      'assets/maps/lttp_palace1_legacy.json',
      'assets/maps/palace1_legacy.json'
    ];

    function tryLoad(i) {
      if (i >= mapUrls.length) {
        statusEl.textContent = 'Map load failed — put lttp_palace1_legacy.json in assets/maps/';
        return;
      }
      statusEl.textContent = 'Loading ' + mapUrls[i] + '…';
      SFMapLoaderV3.load(scene, loader, mapUrls[i], {
        cellSize: 40,
        wallHeight: 80,
        floorY: (typeof RoomBuilderV3 !== 'undefined' ? RoomBuilderV3.FLOOR_Y : 0),
        wallTexture: 'assets/tilesets/temple_green/temple_green.tiles.png',
        floorTexture: 'assets/tilesets/temple_green/temple_green.tiles.png'
      }).then(onBuilt).catch(function (err) {
        console.warn(mapUrls[i], err);
        tryLoad(i + 1);
      });
    }

    function onBuilt(built) {
      solids = built.solidBoxes || [];
      window._d1Billboards = built.billboards || [];
      const spawn = built.spawn;
      const fy = (typeof RoomBuilderV3 !== 'undefined' ? RoomBuilderV3.FLOOR_Y : 0);

      const exitMesh = new THREE.Mesh(
        new THREE.BoxGeometry(50, 8, 50),
        new THREE.MeshBasicMaterial({ color: 0x226622 })
      );
      exitMesh.position.set(spawn.x, fy + 6, spawn.z + 80);
      scene.add(exitMesh);
      exitZone = exitMesh.position;

      const bossDoor = new THREE.Mesh(
        new THREE.BoxGeometry(36, 48, 12),
        new THREE.MeshBasicMaterial({ color: 0xaa4466 })
      );
      bossDoor.position.set(0, fy + 28, -built.h * built.cellSize * 0.35);
      scene.add(bossDoor);
      window._bossDoor = bossDoor.position;

      // SpriteSystem adds FLOOR_Y itself — pass local height only
      player = SpriteSystemV3.createPlayer(loader, {
        position: { x: spawn.x, y: 28, z: spawn.z },
        width: 52, height: 60,
        loader: loader
      });
      scene.add(player.mesh);

      camCtrl = CameraControlsV3.create(camera, renderer.domElement, {
        distance: 180, height: 100, minDistance: 90, maxDistance: 360
      });

      statusEl.textContent = 'D1 ready · ' + built.w + 'x' + built.h +
        ' · cell ' + built.cellSize + ' · things ' + (built.things ? built.things.length : 0);
      animate();
    }

    tryLoad(0);

    window.addEventListener('keydown', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = true;
      if (e.code === 'Escape') {
        try {
          if (typeof PlayerStateV3 !== 'undefined') PlayerStateV3.load().setRoom('index.html').save();
        } catch (err) {}
        location.href = 'index.html';
      }
      if (k === 'f' || k === 'k') tryInteract();
    });
    window.addEventListener('keyup', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = false;
    });

    function blocked(x, z) {
      const r = 14;
      for (let i = 0; i < solids.length; i++) {
        const b = solids[i];
        if (x + r > b.minX && x - r < b.maxX && z + r > b.minZ && z - r < b.maxZ) return true;
      }
      return false;
    }

    function tryInteract() {
      if (!player) return;
      const p = player.mesh.position;
      if (exitZone && Math.hypot(p.x - exitZone.x, p.z - exitZone.z) < 60) {
        location.href = 'index.html';
        return;
      }
      if (window._bossDoor && Math.hypot(p.x - window._bossDoor.x, p.z - window._bossDoor.z) < 55) {
        location.href = 'd_1boss.html';
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!player || !camCtrl) {
        renderer.render(scene, camera);
        return;
      }
      const pos = player.mesh.position;
      let nx = pos.x, nz = pos.z, moving = false, dir = 'down';
      const sp = 3.6;
      if (keys.w) { nz -= sp; dir = 'up'; moving = true; }
      if (keys.s) { nz += sp; dir = 'down'; moving = true; }
      if (keys.a) { nx -= sp; if (!moving) dir = 'left'; moving = true; }
      if (keys.d) { nx += sp; if (!moving) dir = 'right'; moving = true; }
      if (!blocked(nx, pos.z)) pos.x = nx;
      if (!blocked(pos.x, nz)) pos.z = nz;
      if (player.setDirection) player.setDirection(dir);
      if (player.setMoving) player.setMoving(moving);
      if (player.update) player.update();
      if (player.faceCamera) player.faceCamera(camera);
      torch.position.set(pos.x, pos.y + 40, pos.z);
      camCtrl.update(pos);
      if (window._d1Billboards) {
        for (let i = 0; i < window._d1Billboards.length; i++) {
          const b = window._d1Billboards[i];
          if (b) b.lookAt(camera.position.x, b.position.y, camera.position.z);
        }
      }
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', function () {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  })();
  </script>
</body>
</html>

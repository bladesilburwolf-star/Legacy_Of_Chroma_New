<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neondromeda - Dungeon 6 (Shadow Tomb)</title>
    <style>
        @font-face { font-family: 'RetroCGA'; src: url('assets/fonts/Px437_IBM_CGA.ttf') format('truetype'); }
        *{box-sizing:border-box;margin:0;padding:0}
        body{overflow:hidden;background:#000;color:#00ff66;font-family:'RetroCGA',monospace}
        #canvas-container{width:100vw;height:100vh}
        .scanlines{position:absolute;inset:0;z-index:10;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,0.12) 2px,rgba(0,0,0,0.12) 3px);mix-blend-mode:multiply}
        #hud{position:absolute;top:18px;left:18px;z-index:20;background:rgba(0,5,2,0.85);padding:10px 14px;border:2px solid #00ff66;text-shadow:0 0 5px #00ff66}
        #hud .title{font-size:14px}
        #status{position:absolute;left:18px;bottom:18px;color:#66cc88;background:rgba(0,0,0,0.7);padding:6px 10px;border:1px solid #00ff6644}
        #msg{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;background:rgba(8,8,12,0.95);border:2px solid #00ff66;padding:18px 24px;color:#88ffaa}
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="scanlines"></div>
    <div id="hud"><div class="title">DUNGEON 6 // SHADOW TOMB</div><div class="sub">WASD MOVE · SPACE ATTACK · E INTERACT · ESC → SOUTH SECTOR</div></div>
    <div id="status">Loading D6...</div>
    <div id="msg"><div id="msg-text">Secret revealed</div></div>

    <!-- Procedural dungeon UI (hidden until approach) -->
    <div id="proc-ui" style="display:none;position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:120;background:rgba(4,4,8,0.95);border:2px solid #00ff66;padding:14px 18px;font-family:monospace;color:#ccffdd">
        <div style="font-size:14px;margin-bottom:8px">Generate Procedural Dungeon</div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
            <label>Seed</label><input id="proc-seed" type="number" style="width:120px" />
            <button id="proc-random">Randomize</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
            <label>Grid</label><input id="proc-gridw" type="number" value="40" style="width:60px" /> x <input id="proc-gridh" type="number" value="32" style="width:60px" />
            <label style="margin-left:8px">Cell</label><input id="proc-cell" type="number" value="24" style="width:60px" />
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <button id="proc-cancel">Cancel</button>
            <button id="proc-gen">Generate</button>
        </div>
    </div>

    <!-- engine scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="src/engine/Three_js_system/room_builder_v3.js"></script>
    <script src="src/engine/Three_js_system/sprite_system_v3.js"></script>
    <script src="src/engine/Three_js_system/heightmap_generator_v3.js"></script>
    <script src="src/engine/Three_js_system/normalmap_generator_v3.js"></script>
    <script src="src/engine/Three_js_system/terrain_generator_v3.js"></script>
    <script src="src/engine/Three_js_system/paint_terrain.js"></script>
    <script src="src/engine/Three_js_system/rooms/procedural_room.js"></script>
    <script src="src/engine/Three_js_system/clock_system_v3.js"></script>
    <script src="src/engine/Three_js_system/hp_bar_system_v3.js"></script>
    <script src="src/engine/Three_js_system/inventory_system_v3.js"></script>
    <script src="src/engine/Three_js_system/combat_system_v3.js"></script>
    <script src="src/engine/Three_js_system/camera_controls_v3.js"></script>
    <script src="src/engine/Three_js_system/interact_system_v3.js"></script>
    <script src="src/engine/Three_js_system/collision_system_v3.js"></script>

    <script>
    (function(){
        const container = document.getElementById('canvas-container');
        const statusEl = document.getElementById('status');
        const msg = document.getElementById('msg');
        const msgText = document.getElementById('msg-text');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x04040a);
        scene.fog = new THREE.FogExp2(0x02020a, 0.0025);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias:true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
        container.appendChild(renderer.domElement);

        const loader = new THREE.TextureLoader();
        function prep(tex){ if(!tex) return tex; tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false; return tex; }

        const camCtrl = CameraControlsV3.create(camera, renderer.domElement, { distance: 150, height: 60, minDistance: 70, maxDistance: 380 });

        // small procedural floor for approach
        const EXT_W = 900, EXT_D = 700;
        const groundTex = prep(loader.load('assets/textures/rock1.jpg'));
        groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping; groundTex.repeat.set(6,6);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(EXT_W, EXT_D), new THREE.MeshBasicMaterial({ map: groundTex, side:THREE.DoubleSide }));
        ground.rotation.x = -Math.PI/2; ground.position.set(0, RoomBuilderV3.FLOOR_Y - 2, 0); scene.add(ground);

        // Tomb interior dimensions
        const T_W = 360, T_D = 260, T_H = 160;
        const centerZ = -80;

        // Build tomb using D6Room module
        let d6 = null;
        let room = null; // ensure room variable exists for later systems
        try {
            if (typeof D6Room !== 'undefined') {
                d6 = D6Room.build(scene, loader, { addLights: true });
                if (d6 && d6.room) room = d6.room;
            }
        } catch (e) { console.warn('D6Room.build failed', e); }

        // If D6Room isn't available for some reason, fall back to the inline primitive build
        if (!d6) {
            const S = RoomBuilderV3.shape;
            const tombShapes = [
                S({ id:'t_floor', layer:'L3', geo:'Cube', scale:{x:T_W+20,y:10,z:T_D+20}, position:{x:0,y:5,z:centerZ}, color:'#080808', solid:true }),
                S({ id:'wall_n', layer:'L2', geo:'Cube', scale:{x:T_W,y:T_H,z:12}, position:{x:0,y:T_H/2+5,z:centerZ - T_D/2 + 6}, color:'#1a1a1a', solid:true }),
                S({ id:'wall_s', layer:'L2', geo:'Cube', scale:{x:T_W,y:T_H,z:12}, position:{x:0,y:T_H/2+5,z:centerZ + T_D/2 - 6}, color:'#1a1a1a', solid:true }),
                S({ id:'wall_w', layer:'L2', geo:'Cube', scale:{x:12,y:T_H,z:T_D}, position:{x:-T_W/2 + 6,y:T_H/2+5,z:centerZ}, color:'#1a1a1a', solid:true }),
                S({ id:'wall_e', layer:'L2', geo:'Cube', scale:{x:12,y:T_H,z:T_D}, position:{x:T_W/2 - 6,y:T_H/2+5,z:centerZ}, color:'#1a1a1a', solid:true }),
                S({ id:'roof', layer:'L2', geo:'Cube', scale:{x:T_W+8,y:28,z:T_D+8}, position:{x:0,y:T_H+20,z:centerZ}, color:'#050509', solid:true })
            ];
            room = RoomBuilderV3.build(scene, tombShapes, { layerZ:{L1:-80,L2:-20,L3:0,UI:100} });
            // visual walls
            function addVisualWall(path, x,y,z,w,h,rotY){ const tex = prep(loader.load(path)); const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, side:THREE.DoubleSide, depthWrite:false }); const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat); mesh.position.set(x,y,z); if (rotY) mesh.rotation.y = rotY; mesh.userData.visualOnly = true; scene.add(mesh); return mesh; }
            addVisualWall('assets/d1/D1 WALLS.png', T_W/2 - 8, RoomBuilderV3.FLOOR_Y + T_H/2, centerZ, 280, 140, Math.PI/2);
            addVisualWall('assets/textures/rock1.jpg', -60, RoomBuilderV3.FLOOR_Y + 40, centerZ - 40, 40, 80, 0);
            const hiddenRoom = new THREE.Group(); hiddenRoom.visible = false; const hrFloor = new THREE.Mesh(new THREE.PlaneGeometry(180,140), new THREE.MeshBasicMaterial({ map: prep(loader.load('assets/textures/dirt1.jpg')), side:THREE.DoubleSide })); hrFloor.rotation.x = -Math.PI/2; hrFloor.position.set(0, RoomBuilderV3.FLOOR_Y - 1, centerZ + T_D/2 + 80); hiddenRoom.add(hrFloor); const chestMat = new THREE.MeshBasicMaterial({ map: prep(loader.load('assets/chests/BIGCHEST-1.png')), transparent:true, side:THREE.DoubleSide }); const chest = new THREE.Mesh(new THREE.PlaneGeometry(56,48), chestMat); chest.position.set(0, RoomBuilderV3.FLOOR_Y + 24, centerZ + T_D/2 + 80); hiddenRoom.add(chest); scene.add(hiddenRoom);
            var secretTrigger = { x: 0, z: centerZ + T_D/2 + 40, radius: 36, revealed:false };
            const door = addVisualWall('assets/dungeons/LOCKEDDOOR-1.png', 0, RoomBuilderV3.FLOOR_Y + 60, centerZ + T_D/2 - 12, 72, 120, 0);
            // provide d6 fallback object to keep rest of code working
            d6 = { hiddenRoom: hiddenRoom, secretTrigger: secretTrigger, doorPos: { x:0,y:RoomBuilderV3.FLOOR_Y+60,z:centerZ + T_D/2 - 12 }, spawn:{ x:0,y:0,z:centerZ + T_D/2 + 240 }, room: room };
        }

        // Door / entrance: visual door plane (use returned doorPos)
        const door = addVisualWall('assets/dungeons/LOCKEDDOOR-1.png', d6.doorPos.x, d6.doorPos.y, d6.doorPos.z, 72, 120, 0);

        // Player spawn
        const player = SpriteSystemV3.createPlayer(loader, { position:{ x:d6.spawn.x, y:d6.spawn.y, z:d6.spawn.z }, layer:'L3' }); scene.add(player.mesh);
        player.radius = player.width ? player.width * 0.45 : 18;

        // Systems
        const hpBars = HpBarSystemV3.create(scene, loader); hpBars.attach(player.mesh, { type:'player', max:6, current:6, offsetY:52 });
        const inventory = InventorySystemV3.create({ starter:['woodsword','lantern'], onLantern:function(on){ statusEl.textContent = on? 'Lantern ON':'Lantern OFF' } }); inventory.equip('woodsword');
        const combat = CombatSystemV3.create(scene, loader, player, { maxHealth:6, onDamage:function(hp){ statusEl.textContent = 'HP: '+hp; } });
        const collision = CollisionSystemV3.create();

        // Procedural dungeon state
        let currentProc = null; // holds {container, spawn,...}
        const procUI = document.getElementById('proc-ui');
        const procSeedEl = document.getElementById('proc-seed');
        const procGridW = document.getElementById('proc-gridw');
        const procGridH = document.getElementById('proc-gridh');
        const procCell = document.getElementById('proc-cell');
        // show UI only once per browser session
        let procShown = false;
        try { procShown = sessionStorage.getItem('d6_proc_shown') === '1'; } catch(e) { procShown = false; }
        if (procShown) procUI.style.display = 'none';
        document.getElementById('proc-random').addEventListener('click', function(){ procSeedEl.value = Math.floor(Math.random()*1000000); });
        document.getElementById('proc-cancel').addEventListener('click', function(){ procUI.style.display = 'none'; });
        document.getElementById('proc-gen').addEventListener('click', function(){
            const seed = Number(procSeedEl.value) || Math.floor(Math.random()*1000000);
            const gridW = Number(procGridW.value) || 40;
            const gridH = Number(procGridH.value) || 32;
            const cell = Number(procCell.value) || 24;
            // remove existing
            try { if (currentProc && currentProc.container && currentProc.container.parent) currentProc.container.parent.remove(currentProc.container); } catch(e){}
            // build procedurally centered inside tomb
            try {
                currentProc = ProceduralRoom.build(scene, loader, { seed: seed, gridW: gridW, gridH: gridH, cellSize: cell, addVisuals: true, offsetX: 0, offsetZ: centerZ });
                // teleport player to spawn inside generated dungeon
                if (currentProc && currentProc.spawn) {
                    player.mesh.position.set(currentProc.spawn.x, RoomBuilderV3.FLOOR_Y + 6, currentProc.spawn.z);
                }
                procUI.style.display = 'none';
                procShown = true;
                try { sessionStorage.setItem('d6_proc_shown','1'); } catch(e){}
                statusEl.textContent = 'Procedural dungeon generated (seed ' + currentProc.seed + ')';
            } catch(e) { console.warn('procedural build failed', e); }
        });


        // add some shadow enemies that patrol near the center
        const enemies = [];
        function spawnShadow(x,z){ const e = SpriteSystemV3.createEnemy('assets/enemies/NEONSKULL-1.png', loader, { position:{x:x,y:0,z:z}, width:48, height:48, layer:'L3' }); e.radius=24; e.height=40; scene.add(e.mesh); enemies.push(e); hpBars.attach(e.mesh, { type:'enemy', max:2, current:2, offsetY:36 }); }
        spawnShadow(-40, centerZ - 20); spawnShadow(60, centerZ + 10);

        // Interaction keys
        const keys = { w:false,a:false,s:false,d:false, attack:false, interact:false };
        window.addEventListener('keydown', function(ev){ if (ev.repeat) return; const k=ev.key.toLowerCase(); if (k in keys) keys[k]=true; if (k==='e') keys.interact=true; if (k==='escape') window.location.href = 'south_sector.html'; });
        window.addEventListener('keyup', function(ev){ const k=ev.key.toLowerCase(); if (k in keys) keys[k]=false; if (k==='e') keys.interact=false; });

        // Animate
        function animate(){ requestAnimationFrame(animate); const dt = 1/60;
            // combat / movement
            combat.update(dt, { w:keys.w,a:keys.a,s:keys.s,d:keys.d, attack:keys.attack }, room, enemies, camCtrl.state?camCtrl.state.yaw:0);
            // collisions
            collision.update({ player:player, enemies:enemies, room:room, terrain:null, props:[] });
            // camera
            camCtrl.update(player.mesh.position);
            // face camera for billboards
            if (enemies) enemies.forEach(e=>{ if (e.faceCamera) e.faceCamera(camera); });
            hpBars.update(camera);

            // show procedural UI when near entrance
            try {
                if (d6 && d6.doorPos) {
                    const dx0 = player.mesh.position.x - d6.doorPos.x;
                    const dz0 = player.mesh.position.z - d6.doorPos.z;
                    const dist0 = Math.sqrt(dx0*dx0 + dz0*dz0);
                    if (dist0 < 140 && !procShown && procUI.style.display === 'none') {
                        procSeedEl.value = procSeedEl.value || Math.floor(Math.random()*1000000);
                        procUI.style.display = 'block';
                        procShown = true;
                        try { sessionStorage.setItem('d6_proc_shown','1'); } catch(e){}
                    }
                }
            } catch(e){}

            // interaction check for secret reveal
            try {
                const dx = player.mesh.position.x - secretTrigger.x;
                const dz = player.mesh.position.z - secretTrigger.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < secretTrigger.radius && keys.interact && !secretTrigger.revealed) {
                    secretTrigger.revealed = true; hiddenRoom.visible = true; msgText.textContent = 'A hidden passage opens...'; msg.style.display = 'block'; setTimeout(()=>{ msg.style.display='none'; }, 1800);
                }
            } catch(e){}

            statusEl.textContent = 'X:'+player.mesh.position.x.toFixed(0)+' Z:'+player.mesh.position.z.toFixed(0);
            renderer.render(scene,camera);
        }
        animate();

        window.addEventListener('resize', ()=>{ camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    })();
    </script>
</body>
</html>

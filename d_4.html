<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy of Chroma — Shadow Palace (D4)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #020108; color: #c8a0ff; font-family: monospace; }
    #hud {
      position: absolute; top: 14px; left: 14px; z-index: 20;
      background: rgba(8,0,16,0.92); border: 2px solid #7a40c0; padding: 10px 14px;
      max-width: 560px; box-shadow: 0 0 18px rgba(120,40,200,0.35);
    }
    #hud .title { color: #e0b0ff; letter-spacing: 0.1em; font-size: 13px; }
    #hud .sub { font-size: 10px; color: #9a70c0; margin-top: 4px; line-height: 1.45; }
    #hearts { margin-top: 6px; color: #f66; letter-spacing: 2px; }
    #equip { margin-top: 4px; font-size: 11px; color: #d0b8f0; }
    #status {
      position: absolute; bottom: 12px; left: 14px; z-index: 20;
      font-size: 11px; background: rgba(0,0,0,0.8); padding: 5px 10px;
      border: 1px solid #503080;
    }
    #room-tag {
      position: absolute; top: 14px; right: 14px; z-index: 20;
      font-size: 12px; color: #e8c0ff; background: rgba(20,0,40,0.85);
      padding: 6px 12px; border: 1px solid #8040c0;
    }
    .scan {
      pointer-events: none; position: fixed; inset: 0; z-index: 50;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(80,0,120,0.04) 3px);
    }
  </style>
</head>
<body>
  <div class="scan"></div>
  <div id="hud">
    <div class="title">SHADOW PALACE // D4</div>
    <div class="sub">
      A/D move · W/S high/low aim · SPACE jump · J thrust<br>
      F interact / depth door · 1–3 sword · ESC field<br>
      Three depth lanes — switch only at purple portals
    </div>
    <div id="hearts">♥♥♥♥♥♥♥♥</div>
    <div id="equip">Weapon: Wood Sword · Keys: 0 · Kills: 0 · Lane: FRONT</div>
  </div>
  <div id="room-tag">Entrance Hall</div>
  <div id="status">Loading Shadow Palace…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/engine/Three_js_system/sidescroll_physics_v3.js"></script>
  <script src="src/engine/Three_js_system/zelda2_combat_v3.js"></script>
  <script src="src/engine/Three_js_system/depth_stack_v3.js"></script>
  <script src="src/engine/Three_js_system/audio_system_v3.js"></script>
  <script src="src/engine/Three_js_system/inventory_system_v3.js"></script>

  <script>
  (function () {
    const statusEl = document.getElementById('status');
    const heartsEl = document.getElementById('hearts');
    const equipEl = document.getElementById('equip');
    const roomTag = document.getElementById('room-tag');

    // ---- Fail soft if modules missing ----
    if (typeof SidescrollPhysicsV3 === 'undefined' || typeof Zelda2CombatV3 === 'undefined') {
      statusEl.textContent = 'Missing sidescroll/zelda2 modules — copy from src/engine/Three_js_system/';
      return;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060210);
    scene.fog = new THREE.FogExp2(0x120820, 0.0014);

    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x4a3080, 0.55));
    scene.add(new THREE.HemisphereLight(0x8866cc, 0x1a1020, 0.4));
    const torch = new THREE.PointLight(0xaa66ff, 1.15, 420);
    scene.add(torch);
    const fill = new THREE.DirectionalLight(0xccbbff, 0.25);
    fill.position.set(40, 120, 80);
    scene.add(fill);

    const loader = new THREE.TextureLoader();
    const audio = (typeof AudioSystemV3 !== 'undefined')
      ? AudioSystemV3.create({ musicVolume: 0.36, sfxVolume: 0.5 }) : null;
    const inv = (typeof InventorySystemV3 !== 'undefined')
      ? InventorySystemV3.create({ starter: ['woodsword'] }) : null;
    if (inv) inv.equip('woodsword');

    let musicOn = false;
    function startMusic() {
      if (musicOn || !audio) return;
      musicOn = true;
      audio.playMusic('assets/music/21 Dark Golden Land.mp3');
    }

    // ============================================================
    // SHADOW PALACE LAYOUT — 3 depth lanes
    // Lane 0 FRONT (z=50), 1 MID (z=0), 2 BACK (z=-50)
    // ============================================================
    const LANE_Z = [50, 0, -50];
    const LANE_NAME = ['FRONT', 'MID', 'BACK'];

    // Wide palace: entrance → gap → mid climb → locked gate → upper → boss ante
    const lanes = [
      {
        z: LANE_Z[0],
        pitY: -280,
        platforms: [
          // Entrance floor
          { x0: -80, x1: 220, y: 0 },
          // Gap then far floor
          { x0: 280, x1: 520, y: 0 },
          // Mid platforms climb
          { x0: 340, x1: 420, y: 70 },
          { x0: 430, x1: 520, y: 130 },
          // High bridge to gate
          { x0: 520, x1: 700, y: 130 },
          // After gate (unlocked area)
          { x0: 720, x1: 980, y: 130 },
          // Drop to lower east
          { x0: 820, x1: 1100, y: 0 },
          // Boss ante ledge
          { x0: 1100, x1: 1280, y: 40 }
        ],
        walls: [
          { x: -78, y0: 0, y1: 200 },
          { x: 1278, y0: 0, y1: 220 }
        ]
      },
      {
        z: LANE_Z[1],
        pitY: -280,
        platforms: [
          { x0: -40, x1: 180, y: 20 },
          { x0: 200, x1: 360, y: 20 },
          { x0: 250, x1: 320, y: 90 },
          { x0: 360, x1: 560, y: 60 },
          { x0: 560, x1: 720, y: 120 },
          { x0: 740, x1: 960, y: 40 },
          { x0: 960, x1: 1200, y: 40 },
          // Floating mid-only secret ledge
          { x0: 600, x1: 680, y: 200 }
        ],
        walls: []
      },
      {
        z: LANE_Z[2],
        pitY: -280,
        platforms: [
          { x0: 0, x1: 160, y: 40 },
          { x0: 180, x1: 400, y: 40 },
          { x0: 300, x1: 380, y: 110 },
          { x0: 420, x1: 620, y: 80 },
          { x0: 650, x1: 900, y: 20 },
          { x0: 920, x1: 1150, y: 80 },
          // Shadow walkway above
          { x0: 700, x1: 860, y: 180 }
        ],
        walls: []
      }
    ];

    // Depth portals (lane doors)
    const laneDoors = [
      { x: 60, fromLane: 0, toLane: 1, landX: 60, landY: 20 },
      { x: 60, fromLane: 1, toLane: 0, landX: 60, landY: 0 },
      { x: 60, fromLane: 1, toLane: 2, landX: 60, landY: 40 },
      { x: 60, fromLane: 2, toLane: 1, landX: 60, landY: 20 },
      // Mid palace depth swap
      { x: 400, fromLane: 0, toLane: 1, landX: 400, landY: 60 },
      { x: 400, fromLane: 1, toLane: 0, landX: 400, landY: 0 },
      { x: 400, fromLane: 1, toLane: 2, landX: 400, landY: 80 },
      { x: 400, fromLane: 2, toLane: 1, landX: 400, landY: 60 },
      // East
      { x: 900, fromLane: 0, toLane: 1, landX: 900, landY: 40 },
      { x: 900, fromLane: 1, toLane: 0, landX: 900, landY: 0 },
      { x: 900, fromLane: 1, toLane: 2, landX: 900, landY: 80 },
      { x: 900, fromLane: 2, toLane: 1, landX: 900, landY: 40 }
    ];

    // ---- Visual depth layers (parallax walls) ----
    if (typeof DepthStackV3 !== 'undefined') {
      DepthStackV3.buildColorLayers(scene, [
        { z: -180, color: 0x140820, width: 1600, height: 420, y: 120, x: 500 },
        { z: -120, color: 0x1c1030, width: 1500, height: 360, y: 100, x: 500 },
        { z: -70, color: 0x281848, width: 1400, height: 300, y: 90, x: 500 }
      ]);
    } else {
      const bg = new THREE.Mesh(
        new THREE.PlaneGeometry(1600, 400),
        new THREE.MeshBasicMaterial({ color: 0x180c28 })
      );
      bg.position.set(500, 100, -150);
      scene.add(bg);
    }

    // Platform meshes per lane (tint by depth)
    const laneColors = [0x6a40a0, 0x503080, 0x3a2060];
    function buildPlatformVisuals() {
      lanes.forEach(function (lane, li) {
        lane.platforms.forEach(function (p) {
          const w = p.x1 - p.x0;
          const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(w, 10, 28),
            new THREE.MeshStandardMaterial({
              color: laneColors[li],
              roughness: 0.85,
              metalness: 0.1,
              emissive: 0x1a0840,
              emissiveIntensity: 0.15
            })
          );
          mesh.position.set((p.x0 + p.x1) * 0.5, p.y - 5, lane.z);
          scene.add(mesh);
        });
      });
    }
    buildPlatformVisuals();

    // Portal markers (visible at door x positions unique)
    const portalXs = [60, 400, 900];
    portalXs.forEach(function (px) {
      LANE_Z.forEach(function (z, li) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(14, 48, 8),
          new THREE.MeshBasicMaterial({
            color: 0xcc66ff,
            transparent: true,
            opacity: 0.55 + li * 0.1
          })
        );
        m.position.set(px, 28, z);
        scene.add(m);
      });
    });

    // Locked gate on FRONT at x~710 (blocks until key)
    let gateOpen = false;
    const gateMesh = new THREE.Mesh(
      new THREE.BoxGeometry(16, 90, 36),
      new THREE.MeshStandardMaterial({ color: 0x442266, emissive: 0x220044, emissiveIntensity: 0.3 })
    );
    gateMesh.position.set(710, 175, LANE_Z[0]);
    scene.add(gateMesh);

    // ---- Physics ----
    const physics = SidescrollPhysicsV3.create({
      startX: 20,
      startY: 40,
      startLane: 0
    });

    // ---- Player visual ----
    function makeBillboard(path, w, h, colorFallback) {
      const mat = new THREE.MeshBasicMaterial({
        color: colorFallback || 0xffffff,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: true
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      loader.load(path, function (tex) {
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        mat.map = tex;
        mat.color.setHex(0xffffff);
        mat.needsUpdate = true;
      }, undefined, function () { /* keep solid color */ });
      scene.add(mesh);
      return { mesh: mesh, material: mat, width: w, height: h };
    }

    const player = makeBillboard('assets/player/SOUTH.png', 36, 48, 0x44ff88);
    const playerAlt = {
      faceCamera: function (cam) {
        player.mesh.lookAt(cam.position.x, player.mesh.position.y, cam.position.z);
      }
    };

    // ---- Enemies (per-lane) ----
    const enemies = [];
    function addEnemy(x, y, lane, hp, path, kind) {
      const spr = makeBillboard(path, 30, 30, 0x66ffaa);
      const e = {
        x: x, y: y, lane: lane, hp: hp, maxHp: hp, dead: false,
        mesh: spr.mesh, material: spr.material, kind: kind || 'slime',
        patrolMin: x - 40, patrolMax: x + 40, dir: 1, speed: 28,
        // Zelda2CombatV3 calls onHit(form) → true means remove
        onHit: function (form) {
          const dmg = (window._shadowDmg || 1);
          e.hp -= dmg;
          if (e.mesh && e.mesh.material) {
            e.mesh.material.opacity = 0.4;
            setTimeout(function () {
              if (e.mesh && e.mesh.material && !e.dead) e.mesh.material.opacity = (e.lane === physics.lane) ? 1 : 0.35;
            }, 80);
          }
          if (e.hp <= 0) {
            e.dead = true;
            return true;
          }
          return false;
        }
      };
      enemies.push(e);
      return e;
    }

    // Front lane threats
    addEnemy(150, 0, 0, 2, 'assets/enemies/SLIME-1.png', 'slime');
    addEnemy(320, 0, 0, 2, 'assets/enemies/SLIME-1.png', 'slime');
    addEnemy(480, 130, 0, 3, 'assets/enemies/skull.png', 'skull');
    addEnemy(900, 0, 0, 3, 'assets/enemies/soldier.png', 'soldier');
    addEnemy(1180, 40, 0, 5, 'assets/enemies/elecghost.png', 'ghost');
    // Mid
    addEnemy(280, 20, 1, 2, 'assets/enemies/greenblob.png', 'blob');
    addEnemy(500, 60, 1, 3, 'assets/enemies/skull.png', 'skull');
    addEnemy(800, 40, 1, 2, 'assets/enemies/SLIME-1.png', 'slime');
    // Back (harder / denser)
    addEnemy(220, 40, 2, 3, 'assets/enemies/elecskull.png', 'elec');
    addEnemy(500, 80, 2, 4, 'assets/enemies/hardsoldier.png', 'hard');
    addEnemy(780, 20, 2, 3, 'assets/enemies/ghost.png', 'ghost');

    // ---- Interactables ----
    const interactables = [];
    function addProp(type, x, y, lane, path, w, h) {
      const spr = makeBillboard(path, w, h, type.indexOf('CHEST') >= 0 ? 0xccaa44 : 0xaa88ff);
      spr.mesh.position.set(x, y + h * 0.5, LANE_Z[lane]);
      interactables.push({
        type: type, x: x, y: y, lane: lane, open: false,
        mesh: spr.mesh, w: w, h: h
      });
    }

    addProp('CHESTSM', 100, 0, 0, 'assets/storage/smallchestclosed.png', 26, 22);
    addProp('CHESTSM', 360, 70, 0, 'assets/storage/smallchestclosed.png', 26, 22);
    addProp('CHESTBG', 640, 200, 1, 'assets/storage/bigchestclosed.png', 34, 28); // secret mid high
    addProp('JAR', 200, 0, 0, 'assets/obstacles/jar.png', 18, 22);
    addProp('JAR', 450, 0, 0, 'assets/obstacles/jar.png', 18, 22);
    addProp('JAR', 300, 20, 1, 'assets/obstacles/jar.png', 18, 22);
    addProp('EXIT', 1240, 40, 0, 'assets/doors/bosslock.png', 28, 48);

    // ---- Combat ----
    let kills = 0;
    const combat = Zelda2CombatV3.create(physics, {
      maxHealth: 8,
      onDamage: function (hp, max) { paintHearts(hp, max); },
      onDeath: function () {
        statusEl.textContent = 'Fallen in the Shadow Palace — Esc field / refresh';
      },
      onEnemyHit: function () {
        if (audio) audio.sfx('assets/music/$84-Scratch.wav');
      },
      onKillEnemy: function (e) {
        kills++;
        if (e.mesh) e.mesh.visible = false;
        e.dead = true;
        if (audio) audio.sfx('assets/fanfare/secret.wav');
        paintEquip();
      }
    });

    // Sync weapon damage if inventory present
    function weaponDmg() {
      if (!inv || !InventorySystemV3.weaponDamage) return 1;
      return InventorySystemV3.weaponDamage(inv.getEquipped()) || 1;
    }
    window._shadowDmg = weaponDmg();
      if (combat.setWeaponDamage) combat.setWeaponDamage(weaponDmg());

    function paintHearts(hp, max) {
      let s = '';
      for (let i = 0; i < max; i++) s += i < hp ? '♥' : '♡';
      heartsEl.textContent = s;
    }
    function paintEquip() {
      const id = inv && inv.getEquipped ? inv.getEquipped() : 'woodsword';
      const name = (InventorySystemV3 && InventorySystemV3.CATALOG && InventorySystemV3.CATALOG[id])
        ? InventorySystemV3.CATALOG[id].name : id;
      const keysN = inv && inv.count ? inv.count('smallkey') : 0;
      equipEl.textContent = 'Weapon: ' + name + ' · Keys: ' + keysN +
        ' · Kills: ' + kills + ' · Lane: ' + LANE_NAME[physics.lane];
      window._shadowDmg = weaponDmg();
      if (combat.setWeaponDamage) combat.setWeaponDamage(weaponDmg());
    }
    paintHearts(combat.getHealth(), combat.getMaxHealth());
    paintEquip();

    // Room name by X
    function updateRoomTag() {
      const x = physics.x;
      let name = 'Entrance Hall';
      if (x > 250 && x < 550) name = 'Pillar Ascent';
      else if (x >= 550 && x < 720) name = gateOpen ? 'Gate Passage' : 'Sealed Gate';
      else if (x >= 720 && x < 1050) name = 'Eastern Vault';
      else if (x >= 1050) name = 'Boss Antechamber';
      if (physics.lane === 2) name += ' [Shadow Walk]';
      else if (physics.lane === 1) name += ' [Mid Depth]';
      roomTag.textContent = name;
    }

    // ---- Input ----
    const keys = {
      left: false, right: false, up: false, down: false,
      jump: false, attack: false, interact: false
    };
    window.addEventListener('keydown', function (e) {
      startMusic();
      const c = e.code;
      if (c === 'KeyA' || c === 'ArrowLeft') keys.left = true;
      if (c === 'KeyD' || c === 'ArrowRight') keys.right = true;
      if (c === 'KeyW') keys.up = true;
      if (c === 'KeyS') keys.down = true;
      if (c === 'Space') { keys.jump = true; e.preventDefault(); }
      if (c === 'KeyJ' || c === 'KeyB' || c === 'KeyK') keys.attack = true;
      if (c === 'KeyF' || c === 'KeyE') {
        keys.interact = true;
        tryInteract();
      }
      if (e.key === '1' && inv) { inv.equip('woodsword'); paintEquip(); }
      if (e.key === '2' && inv) { inv.give('metalsword'); inv.equip('metalsword'); paintEquip(); }
      if (e.key === '3' && inv) { inv.give('plasmasword'); inv.equip('plasmasword'); paintEquip(); }
      if (c === 'Escape') {
        if (audio) audio.stopMusic();
        location.href = 'index.html';
      }
    });
    window.addEventListener('keyup', function (e) {
      const c = e.code;
      if (c === 'KeyA' || c === 'ArrowLeft') keys.left = false;
      if (c === 'KeyD' || c === 'ArrowRight') keys.right = false;
      if (c === 'KeyW') keys.up = false;
      if (c === 'KeyS') keys.down = false;
      if (c === 'Space') keys.jump = false;
      if (c === 'KeyJ' || c === 'KeyB' || c === 'KeyK') keys.attack = false;
      if (c === 'KeyF' || c === 'KeyE') keys.interact = false;
    });

    function tryInteract() {
      // Gate unlock on FRONT near 710
      if (physics.lane === 0 && Math.abs(physics.x - 710) < 40 && !gateOpen) {
        const has = inv && inv.has && inv.has('smallkey');
        if (has) {
          inv.take('smallkey', 1);
          gateOpen = true;
          gateMesh.visible = false;
          // Open path: extend platform continuity already there; remove soft block
          statusEl.textContent = 'Shadow Gate unlocked!';
          if (audio) audio.sfx('assets/fanfare/secret.wav');
          paintEquip();
        } else {
          statusEl.textContent = 'Gate sealed — need a Small Key';
          if (audio) audio.sfx('assets/music/$84-Scratch.wav');
        }
        return;
      }

      // Props on same lane
      let best = null, bestD = 42;
      for (let i = 0; i < interactables.length; i++) {
        const it = interactables[i];
        if (it.lane !== physics.lane || it.open) continue;
        const d = Math.hypot(physics.x - it.x, physics.y - it.y);
        if (d < bestD) { bestD = d; best = it; }
      }
      if (!best) {
        // Lane door handled by physics on interact
        statusEl.textContent = 'Depth portal / nothing else nearby';
        return;
      }

      if (best.type === 'CHESTSM') {
        best.open = true;
        if (inv) inv.give('smallkey');
        best.mesh.material.color.setHex(0x666666);
        statusEl.textContent = 'Small Key!';
        if (audio) audio.sfx('assets/fanfare/smchestepen.wav');
        paintEquip();
      } else if (best.type === 'CHESTBG') {
        best.open = true;
        if (inv) { inv.give('metalsword'); inv.equip('metalsword'); }
        best.mesh.material.color.setHex(0x666666);
        statusEl.textContent = 'Metal Sword from the Shadow Cache!';
        if (audio) audio.sfx('assets/fanfare/itemfanfare.wav');
        paintEquip();
      } else if (best.type === 'JAR') {
        best.open = true;
        best.mesh.visible = false;
        if (Math.random() < 0.4 && combat.heal) {
          combat.heal(1);
          paintHearts(combat.getHealth(), combat.getMaxHealth());
          statusEl.textContent = 'Heart!';
        } else statusEl.textContent = 'Jar shattered';
      } else if (best.type === 'EXIT') {
        if (audio) audio.stopMusic();
        location.href = 'd_1boss.html'; // placeholder boss link
      }
    }

    // Soft gate block: push player left if closed and past gate
    function enforceGate() {
      if (gateOpen || physics.lane !== 0) return;
      if (physics.x > 700 && physics.x < 730 && physics.y < 200) {
        // allow if high above? Gate is at y 130 bridge
        if (physics.y >= 100) {
          physics.x = 698;
        }
      }
    }

    // Enemy patrol (same lane only movement)
    function updateEnemies(dt) {
      enemies.forEach(function (e) {
        if (e.dead) return;
        e.x += e.dir * e.speed * dt;
        if (e.x > e.patrolMax) e.dir = -1;
        if (e.x < e.patrolMin) e.dir = 1;
        e.mesh.position.set(e.x, e.y + 16, LANE_Z[e.lane]);
        e.mesh.lookAt(camera.position.x, e.mesh.position.y, camera.position.z);
        // Dim if not current lane
        e.mesh.material.opacity = (e.lane === physics.lane) ? 1 : 0.35;
      });
    }

    // Respawn if fell
    const spawn = { x: 20, y: 40, lane: 0 };
    function checkPit() {
      if (physics.y < -200) {
        if (combat.applyDamage) {
          // optional
        }
        // soft reset position via recreate is hard; nudge
        // SidescrollPhysics may not expose setters — try assignment if writable
        if (typeof physics.setPosition === 'function') {
          physics.setPosition(spawn.x, spawn.y, spawn.lane);
        }
        if (combat.getHealth && combat.getHealth() > 0) {
          // fall damage without death stack
        }
        statusEl.textContent = 'Fell into the void — returned to entrance';
      }
    }

    statusEl.textContent = 'Shadow Palace ready · F at purple portals to change depth';

    let lastT = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;

      physics.update(dt, keys, lanes, laneDoors);
      enforceGate();
      combat.update(dt, keys, enemies);
      updateEnemies(dt);
      checkPit();

      const z = LANE_Z[physics.lane];
      player.mesh.position.set(physics.x, physics.y + 24, z);
      playerAlt.faceCamera(camera);
      player.mesh.material.opacity = combat.isAttacking && combat.isAttacking() ? 0.85 : 1;

      interactables.forEach(function (it) {
        if (!it.mesh.visible) return;
        it.mesh.lookAt(camera.position.x, it.mesh.position.y, camera.position.z);
        it.mesh.material.opacity = (it.lane === physics.lane) ? 1 : 0.3;
      });

      torch.position.set(physics.x, physics.y + 36, z + 20);

      // Camera: side-view bias, eases Z toward lane
      const camZTarget = 220 + physics.lane * 15;
      camera.position.x += (physics.x - camera.position.x) * Math.min(1, dt * 4);
      camera.position.y += ((physics.y + 55) - camera.position.y) * Math.min(1, dt * 4);
      camera.position.z += (camZTarget - camera.position.z) * Math.min(1, dt * 3);
      camera.lookAt(physics.x, physics.y + 28, z);

      paintEquip();
      updateRoomTag();
      statusEl.textContent =
        'X:' + physics.x.toFixed(0) +
        ' Y:' + physics.y.toFixed(0) +
        ' Lane:' + LANE_NAME[physics.lane] +
        ' G:' + physics.grounded +
        ' HP:' + combat.getHealth() + '/' + combat.getMaxHealth();

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function () {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  })();
  </script>
</body>
</html>

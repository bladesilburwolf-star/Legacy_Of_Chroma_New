<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy of Chroma - Cave Shrine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #050508; color: #88ff88; font-family: monospace; }
    #hud {
      position: absolute; top: 16px; left: 16px; z-index: 20;
      background: rgba(0,8,0,0.85); border: 2px solid #4a8a4a; padding: 10px 14px;
    }
    #hud .sub { font-size: 11px; color: #7aaa7a; margin-top: 4px; }
    #status {
      position: absolute; bottom: 14px; left: 16px; z-index: 20;
      font-size: 11px; background: rgba(0,0,0,0.7); padding: 6px 10px; border: 1px solid #3a6a3a;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>CAVE SHRINE // PROCEDURAL</div>
    <div class="sub" id="hud-sub">WASD move · ARROWS cam · ESC hub</div>
  </div>
  <div id="status">Loading…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/engine/Three_js_system/room_builder_v3.js"></script>
  <script src="src/engine/Three_js_system/sprite_system_v3.js"></script>
  <script src="src/engine/Three_js_system/camera_controls_v3.js"></script>
  <script src="src/engine/Three_js_system/rooms/procedural_room.js"></script>
  <script src="src/engine/Three_js_system/player_state_v3.js"></script>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const seed = parseInt(params.get('seed') || '1', 10) || 1;
    const shrineId = params.get('id') || 'shrine';
    document.getElementById('hud-sub').textContent =
      'ID ' + shrineId + ' · SEED ' + seed + ' · WASD · ARROWS · ESC = field';

    const statusEl = document.getElementById('status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080810);
    scene.fog = new THREE.FogExp2(0x080810, 0.0014);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const loader = new THREE.TextureLoader();
    const built = ProceduralRoom.build(scene, loader, {
      seed: seed,
      gridW: 36,
      gridH: 28,
      cellSize: 28,
      wallHeight: 64,
      roomAttempts: 28
    });

    scene.add(new THREE.AmbientLight(0x445544, 0.55));
    const torch = new THREE.PointLight(0xffaa66, 0.9, 320);
    scene.add(torch);

    const spawn = built.spawn || { x: 0, y: 24, z: 0 };
    const player = SpriteSystemV3.createPlayer(loader, {
      position: { x: spawn.x, y: spawn.y || 24, z: spawn.z },
      width: 48, height: 56
    });
    scene.add(player.mesh);

    const camCtrl = CameraControlsV3.create(camera, renderer.domElement, {
      distance: 160, height: 90, minDistance: 80, maxDistance: 320
    });

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = true;
      if (e.code === 'Escape') {
        if (typeof PlayerStateV3 !== 'undefined') {
          PlayerStateV3.load().setRoom('index.html').save();
        }
        location.href = 'index.html';
      }
    });
    window.addEventListener('keyup', function (e) {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = false;
    });

    const solids = (built.room && built.room.solidBoxes) || built.solidBoxes || [];
    function blocked(x, z) {
      const r = 14;
      for (let i = 0; i < solids.length; i++) {
        const b = solids[i];
        if (x + r > b.minX && x - r < b.maxX && z + r > b.minZ && z - r < b.maxZ) return true;
      }
      return false;
    }

    function animate() {
      requestAnimationFrame(animate);
      const pos = player.mesh.position;
      let nx = pos.x, nz = pos.z, moving = false, dir = 'down';
      const sp = 3.4;
      if (keys.w) { nz -= sp; dir = 'up'; moving = true; }
      if (keys.s) { nz += sp; dir = 'down'; moving = true; }
      if (keys.a) { nx -= sp; if (!moving) dir = 'left'; moving = true; }
      if (keys.d) { nx += sp; if (!moving) dir = 'right'; moving = true; }
      if (!blocked(nx, pos.z)) pos.x = nx;
      if (!blocked(pos.x, nz)) pos.z = nz;
      if (player.setDirection) player.setDirection(dir);
      if (player.setMoving) player.setMoving(moving);
      if (player.update) player.update();
      if (player.faceCamera) player.faceCamera(camera);
      torch.position.set(pos.x, pos.y + 40, pos.z);
      camCtrl.update(pos);
      statusEl.textContent = 'SEED ' + seed + '  X:' + pos.x.toFixed(0) + ' Z:' + pos.z.toFixed(0);
      renderer.render(scene, camera);
    }
    statusEl.textContent = 'Cave ready · seed ' + seed;
    animate();
    window.addEventListener('resize', function () {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  })();
  </script>
</body>
</html>

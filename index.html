<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy of Chroma - Open Field</title>
    <style>
        @font-face {
            font-family: 'RetroCGA';
            src: url('assets/fonts/Px437_IBM_CGA.ttf') format('truetype');
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background: #000;
            color: #00ff66;
            font-family: 'RetroCGA', monospace;
        }
        #canvas-container { width: 100vw; height: 100vh; }

        #hud-frame {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none; z-index: 15;
            object-fit: fill;
        }

        #hud {
            position: absolute; top: 40px; left: 35px; z-index: 20;
            background: rgba(0, 5, 2, 0.85); padding: 10px 14px;
            border: 2px solid #00ff66;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
            text-shadow: 0 0 5px #00ff66;
            line-height: 1.4; max-width: 450px;
            pointer-events: none;
        }
        #hud .title { font-size: 14px; letter-spacing: 0.1em; }
        #hud .sub { font-size: 11px; color: #88ffaa; margin-top: 4px; }

        #status {
            position: absolute; bottom: 18px; left: 35px; z-index: 20;
            font-size: 11px; color: #66cc88;
            background: rgba(0,0,0,0.7);
            padding: 6px 10px;
            border: 1px solid #00ff6644;
        }
        .scanlines {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px, transparent 2px,
                rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 3px
            );
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body>
    <img id="hud-frame" src="HUD.png" alt="HUD Frame" onerror="this.style.display='none'" />
    <div id="canvas-container"></div>
    <div class="scanlines"></div>

    <div id="hud">
        <div class="title">LEGACY OF CHROMA // HYRULE-SCALE FIELD</div>
        <div class="sub" id="hud-sub">WASD MOVE | ARROWS camera | F INTERACT | WEST = WOODS/TOMB</div>
    </div>

    <div id="status">Loading Hub...</div>

    <!-- DIRECT LOAD - bypasses chroma_engine to fix Heightmap not defined bug -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="src/engine/Three_js_system/room_builder_v3.js"></script>
    <script src="src/engine/Three_js_system/sprite_system_v3.js"></script>
    <script src="src/engine/Three_js_system/heightmap_generator_v3.js"></script>
    <script src="src/engine/Three_js_system/normalmap_generator_v3.js"></script>
    <script src="src/engine/Three_js_system/terrain_generator_v3.js"></script>
    <script src="src/engine/Three_js_system/paint_terrain.js"></script>
    <script src="src/engine/Three_js_system/collision_system_v3.js"></script>
    <script src="src/engine/Three_js_system/scoreboard_v3.js"></script>
    <script src="src/engine/Three_js_system/skybox_system_v3.js"></script>
    <script src="src/engine/Three_js_system/clock_system_v3.js"></script>
    <script src="src/engine/Three_js_system/night_spawn_v3.js"></script>
    <script src="src/engine/Three_js_system/hp_bar_system_v3.js"></script>
    <script src="src/engine/Three_js_system/inventory_system_v3.js"></script>
    <script src="src/engine/Three_js_system/ocarina_system_v3.js"></script>
    <script src="src/engine/Three_js_system/weather_system_v3.js"></script>
    <script src="src/engine/Three_js_system/water_system_v3.js"></script>
    <script src="src/engine/Three_js_system/bomb_system_v3.js"></script>
    <script src="src/engine/Three_js_system/player_state_v3.js"></script>
    <script src="src/engine/Three_js_system/menu_system.js"></script>
    <script src="src/engine/Three_js_system/options_menu_v3.js"></script>
    <script src="src/engine/Three_js_system/shrine_system_v3.js"></script>
    <script src="src/engine/Three_js_system/combat_system_v3.js"></script>
    <script src="src/engine/Three_js_system/camera_controls_v3.js"></script>
    <script src="src/engine/Three_js_system/interact_system_v3.js"></script>

    <script>
    (async function () {
        console.log('DIRECT LOAD CHECK:', {
            THREE: typeof THREE,
            RoomBuilderV3: typeof RoomBuilderV3,
            HeightmapGeneratorV3: typeof HeightmapGeneratorV3,
            NormalmapGeneratorV3: typeof NormalmapGeneratorV3,
            TerrainGeneratorV3: typeof TerrainGeneratorV3
        });
        const container = document.getElementById('canvas-container');
        const statusEl  = document.getElementById('status');
        const hudSub    = document.getElementById('hud-sub');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.0015);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 12000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const loader = new THREE.TextureLoader();

        function prep(tex) {
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            tex.generateMipmaps = false;
            return tex;
        }

        // ============================================================
        // CENTRAL SECTOR — Sonic Open Zone style
        // Zone size: L=500 (Z), W=256 (X), H=256 (Y volume)
        // Not seamless open-world: edges warp to other zones.
        // ============================================================
        // Design intent was UE-style units (cm). Our Three.js rooms use
        // ~1 unit ≈ gameplay stride (D1 is 960×720). Scale ×10 so the
        // central Open Zone is a real overworld chunk, not a closet.
        const ZONE_L = 14000;  // N–S  Twilight Princess–class field
        const ZONE_W = 12000;  // E–W
        const ZONE_H = 2560;


        // Day/night skybox cycle — samples in assets/textures/skybox/
        scene.fog = new THREE.FogExp2(0x87a0c0, 0.00022); // long sightlines, TP-scale field
        const sky = SkyboxSystemV3.create(scene, {
            radius: Math.max(ZONE_L, ZONE_W) * 1.4,
            cycleMinutes: 8,
            startHour: 10,
            loader: loader,
            dayFog: 0x87a0c0,
            nightFog: 0x050510
        });
        sky.whenReady().then(function () {
            console.log('Skybox cycle ready');
            statusEl.textContent = 'Sky day/night cycle ready';
        });
        const clock = ClockSystemV3.create({ x: 35, y: 40, hour: 10 });

        // ---- CE1 heightmap + normal bake, grass surface ----
        let terrain = null;
        const TERRAIN_RES = 96;
        const hm = HeightmapGeneratorV3.create({ resolution: TERRAIN_RES, seed: 17 });
        hm.fbm({ scale: 3.2, octaves: 5 });
        // Terminal pad north; hillside shelf west-of-center for start cave + slime
        hm.flattenCircle(0.5, 0.28, 0.05, 0.03); // north terminal area (uv)
        // Hillside shelf: u~0.38 (west), v~0.52 — side of a rise
        hm.flattenCircle(0.38, 0.52, 0.055, 0.12);
        // Soft path from shelf toward terminal
        hm.flattenCircle(0.44, 0.42, 0.04, 0.08);
        // West Lost Woods + tomb courtyard (merged road_1)
        hm.flattenCircle(0.12, 0.48, 0.10, 0.06); // path into woods
        hm.flattenCircle(0.08, 0.42, 0.12, 0.04); // tomb courtyard pad
        // North snow range (raise) + crevice channel
        hm.flattenCircle(0.5, 0.12, 0.28, 0.55);
        hm.flattenCircle(0.5, 0.18, 0.04, 0.02); // crevice path low
        // TP field pads — far biomes (UV 0..1 across full ZONE)
        hm.flattenCircle(0.5, 0.08, 0.12, 0.45);   // far north industrial plateau
        hm.flattenCircle(0.5, 0.15, 0.18, 0.35);   // snow shelf
        hm.flattenCircle(0.85, 0.5, 0.12, 0.08);   // east lake shelf
        hm.flattenCircle(0.5, 0.88, 0.14, 0.06);   // south beach/forest
        hm.flattenCircle(0.52, 0.82, 0.08, 0.05);  // hidden palace pad (south)
        // TP field pads
        // OoT-style terrain holes / gorges (deep sinks)
        hm.brush(0.62, 0.55, 0.04, -0.35);
        hm.brush(0.58, 0.58, 0.03, -0.28);
        hm.brush(0.35, 0.62, 0.035, -0.32);
        hm.brush(0.70, 0.40, 0.03, -0.25);
        hm.brush(0.28, 0.35, 0.03, -0.22);
        // OoT gorge
        const heights = hm.getFloats();

        const nrmBake = NormalmapGeneratorV3.fromHeightmap(hm, { strength: 2.4 });

        terrain = TerrainGeneratorV3.createFromHeights(scene, heights, {
            resolution: TERRAIN_RES,
            sizeX: ZONE_W,
            sizeZ: ZONE_L,
            maxHeight: 90,
            floorY: RoomBuilderV3.FLOOR_Y
        });

        // Grass albedo + baked normal - with fallbacks
        let grassLoaded = false;
        (function applyGrassAndNormal() {
            // Add lights FIRST so material is visible
            if (!scene.getObjectByName('terrain-sun')) {
                const sun = new THREE.DirectionalLight(0xfff5e0, 0.85);
                sun.name = 'terrain-sun';
                sun.position.set(200, 400, 150);
                scene.add(sun);
                scene.add(new THREE.AmbientLight(0x88aa77, 0.45));
            }
            
            const grass = prep(loader.load('assets/textures/grass1.jpg',
                (tex)=>{
                    console.log('Grass loaded OK');
                    tex.wrapS = THREE.RepeatWrapping;
                    tex.wrapT = THREE.RepeatWrapping;
                    tex.repeat.set(ZONE_W / 200, ZONE_L / 200);
                    grassLoaded = true;
                    statusEl.textContent = 'Terrain ready — grass + height + normal';
                },
                null,
                (e)=>{
                    console.warn('Grass texture 404, using vertex colors only', e);
                    statusEl.textContent = 'Terrain: grass.jpg missing - using fallback colors (check assets/textures/grass1.jpg)';
                }
            ));
            grass.wrapS = THREE.RepeatWrapping;
            grass.wrapT = THREE.RepeatWrapping;
            grass.repeat.set(ZONE_W / 200, ZONE_L / 200);
            
            // Base material only if splat painter is unavailable later; splat applyToMesh replaces this
            try {
                if (terrain && terrain.mesh && !terrain.mesh.userData.splatReady) {
                    const normalTex = nrmBake.toTexture();
                    const mat = new THREE.MeshStandardMaterial({
                        map: grass,
                        normalMap: normalTex,
                        normalScale: new THREE.Vector2(1.0, 1.0),
                        roughness: 0.92,
                        metalness: 0.05,
                        side: THREE.DoubleSide
                    });
                    if (terrain.mesh.material && terrain.mesh.material.dispose) {
                        try { terrain.mesh.material.dispose(); } catch (e) {}
                    }
                    terrain.mesh.material = mat;
                }
            } catch (err) {
                console.error('Normal bake failed, keeping default material', err);
            }
            statusEl.textContent = 'Terrain generating...';
        })();

        // ---- PaintTerrainV3 Unity/CryEngine splatmap blend ----
        try {
            if (typeof PaintTerrainV3 !== 'undefined' && terrain && terrain.mesh) {
                const painter = PaintTerrainV3.create({ resolution: 512 });
                painter.setupMaterial(loader, {
                    grass: 'assets/textures/grass1.jpg',
                    snow: 'assets/textures/stone2.jpg',
                    rock: 'assets/textures/rock1.jpg',
                    sand: 'assets/textures/sand1.jpg',
                    tiling: Math.max(48, Math.min(120, Math.max(ZONE_W, ZONE_L) / 100))
                });
                // heights from heightmap (0..1)
                painter.autoPaintFromHeights(heights, {
                    snowHeight: 0.70,
                    rockHeight: 0.45,
                    sandHeight: 0.07
                });
                // Manual biome brushes (UV 0..1, channel names)
                // South / west forests — reinforce grass
                painter.paintBrush(0.5, 0.72, 0.18, 'grass', 0.55);
                painter.paintBrush(0.18, 0.50, 0.14, 'grass', 0.5);
                painter.paintBrush(0.10, 0.48, 0.12, 'grass', 0.55);
                // Paths / dirt
                painter.paintBrush(0.40, 0.48, 0.04, 'sand', 0.75);
                painter.paintBrush(0.45, 0.40, 0.035, 'sand', 0.7);
                painter.paintBrush(0.50, 0.32, 0.035, 'sand', 0.65);
                painter.paintBrush(0.38, 0.52, 0.05, 'sand', 0.55);
                // Tomb stone
                painter.paintBrush(0.08, 0.40, 0.08, 'rock', 0.7);
                // North snow
                painter.paintBrush(0.50, 0.14, 0.16, 'snow', 0.85);
                painter.paintBrush(0.40, 0.16, 0.10, 'snow', 0.7);
                painter.paintBrush(0.60, 0.16, 0.10, 'snow', 0.7);
                painter.paintBrush(0.50, 0.20, 0.04, 'rock', 0.8);
                // Far north industrial rock
                painter.paintBrush(0.50, 0.08, 0.12, 'rock', 0.75);
                // East lake sand fringe
                painter.paintBrush(0.88, 0.50, 0.10, 'sand', 0.65);
                // South beach fringe
                painter.paintBrush(0.50, 0.95, 0.08, 'sand', 0.7);

                painter.applyToMesh(terrain.mesh);
                terrain.mesh.userData.splatReady = true;
                window._terrainPainter = painter;
                statusEl.textContent = 'Terrain splatmap ready (grass/snow/rock/sand)';
            }
        } catch (e) { console.warn('PaintTerrainV3 splat failed', e); }




        // Chromac terminal removed — north is snow mountains

        // V3 structure — platforms + pillars across the zone
        const S = RoomBuilderV3.shape;
        const hubShapes = [
            // Center platform
            S({ id: 'center_pad', layer: 'L3', geo: 'Cube',
                scale: {x: 90, y: 6, z: 90}, sizeZ: 90,
                position: {x: 0, y: 3, z: 0}, color: '#0a1f14', alpha: 0.65, solid: true }),
            // Corner pillars (inset from zone edges)
            S({ id: 'p_ne', layer: 'L2', geo: 'VCylinder',
                scale: {x: 18, y: 80, z: 18}, sizeZ: 18,
                position: {x:  ZONE_W * 0.35, y: 40, z: -ZONE_L * 0.32}, color: '#00cc66', solid: true }),
            S({ id: 'p_nw', layer: 'L2', geo: 'VCylinder',
                scale: {x: 18, y: 80, z: 18}, sizeZ: 18,
                position: {x: -ZONE_W * 0.35, y: 40, z: -ZONE_L * 0.32}, color: '#00cc66', solid: true }),
            S({ id: 'p_se', layer: 'L2', geo: 'VCylinder',
                scale: {x: 18, y: 80, z: 18}, sizeZ: 18,
                position: {x:  ZONE_W * 0.35, y: 40, z:  ZONE_L * 0.32}, color: '#00cc66', solid: true }),
            S({ id: 'p_sw', layer: 'L2', geo: 'VCylinder',
                scale: {x: 18, y: 80, z: 18}, sizeZ: 18,
                position: {x: -ZONE_W * 0.35, y: 40, z:  ZONE_L * 0.32}, color: '#00cc66', solid: true }),
            // Mid-ring markers
            S({ id: 'm_e', layer: 'L2', geo: 'VCylinder',
                scale: {x: 12, y: 50, z: 12}, sizeZ: 12,
                position: {x:  ZONE_W * 0.38, y: 25, z: 0}, color: '#008848', solid: true }),
            S({ id: 'm_w', layer: 'L2', geo: 'VCylinder',
                scale: {x: 12, y: 50, z: 12}, sizeZ: 12,
                position: {x: -ZONE_W * 0.38, y: 25, z: 0}, color: '#008848', solid: true }),
        ];
        const room = RoomBuilderV3.build(scene, hubShapes, {
            layerZ: { L1: -80, L2: -20, L3: 0, L4: 40, UI: 100 }
        });

        // ============================================================
        // MERGED WEST SECTOR (was road_1) — Lost Woods + Tomb + Arcade house
        // Coordinates in western third of expanded ZONE_W
        // ============================================================
        const TOMB_X = -1550, TOMB_Z = -200;
        const HOUSE_X = -1100, HOUSE_Z = -350;
        const westShapes = [
            // ---- Daggerfall tomb ----
            S({ id: 'tomb_wall_n', layer: 'L2', geo: 'Cube',
                scale: { x: 280, y: 90, z: 22 }, sizeZ: 22,
                position: { x: TOMB_X, y: 48, z: TOMB_Z - 180 }, color: '#2a2c30', solid: true }),
            S({ id: 'tomb_wall_w', layer: 'L2', geo: 'Cube',
                scale: { x: 22, y: 90, z: 220 }, sizeZ: 220,
                position: { x: TOMB_X - 140, y: 48, z: TOMB_Z - 60 }, color: '#26282c', solid: true }),
            S({ id: 'tomb_wall_e', layer: 'L2', geo: 'Cube',
                scale: { x: 22, y: 90, z: 220 }, sizeZ: 220,
                position: { x: TOMB_X + 140, y: 48, z: TOMB_Z - 60 }, color: '#26282c', solid: true }),
            S({ id: 'tomb_wall_s_l', layer: 'L2', geo: 'Cube',
                scale: { x: 100, y: 90, z: 22 }, sizeZ: 22,
                position: { x: TOMB_X - 90, y: 48, z: TOMB_Z + 60 }, color: '#2a2c30', solid: true }),
            S({ id: 'tomb_wall_s_r', layer: 'L2', geo: 'Cube',
                scale: { x: 100, y: 90, z: 22 }, sizeZ: 22,
                position: { x: TOMB_X + 90, y: 48, z: TOMB_Z + 60 }, color: '#2a2c30', solid: true }),
            S({ id: 'tomb_gate_l', layer: 'L2', geo: 'Cube',
                scale: { x: 16, y: 100, z: 20 }, sizeZ: 20,
                position: { x: TOMB_X - 55, y: 52, z: TOMB_Z + 60 }, color: '#3a3c42', solid: true }),
            S({ id: 'tomb_gate_r', layer: 'L2', geo: 'Cube',
                scale: { x: 16, y: 100, z: 20 }, sizeZ: 20,
                position: { x: TOMB_X + 55, y: 52, z: TOMB_Z + 60 }, color: '#3a3c42', solid: true }),
            S({ id: 'tomb_gate_top', layer: 'L2', geo: 'Cube',
                scale: { x: 110, y: 20, z: 20 }, sizeZ: 20,
                position: { x: TOMB_X, y: 110, z: TOMB_Z + 60 }, color: '#444850', solid: false }),
            S({ id: 'tomb_keep', layer: 'L2', geo: 'Cube',
                scale: { x: 120, y: 110, z: 80 }, sizeZ: 80,
                position: { x: TOMB_X, y: 58, z: TOMB_Z - 80 }, color: '#1e2024', solid: true }),
            S({ id: 'tomb_roof', layer: 'L3', geo: 'Cube',
                scale: { x: 100, y: 28, z: 80 }, sizeZ: 80,
                position: { x: TOMB_X, y: 128, z: TOMB_Z - 60 }, color: '#2e3038', solid: false }),
            S({ id: 'tomb_spire', layer: 'L3', geo: 'Cube',
                scale: { x: 24, y: 50, z: 24 }, sizeZ: 24,
                position: { x: TOMB_X, y: 165, z: TOMB_Z - 60 }, color: '#3a3c44', solid: false }),
            S({ id: 'tomb_step1', layer: 'L1', geo: 'Cube',
                scale: { x: 70, y: 8, z: 20 }, sizeZ: 20,
                position: { x: TOMB_X, y: 6, z: TOMB_Z + 20 }, color: '#303238', solid: false }),
            S({ id: 'tomb_step2', layer: 'L1', geo: 'Cube',
                scale: { x: 60, y: 8, z: 18 }, sizeZ: 18,
                position: { x: TOMB_X, y: 12, z: TOMB_Z }, color: '#34363c', solid: false }),
            S({ id: 'tomb_door', layer: 'L3', geo: 'Cube',
                scale: { x: 28, y: 44, z: 6 }, sizeZ: 6,
                position: { x: TOMB_X, y: 40, z: TOMB_Z + 10 }, color: '#224422', solid: false }),
            // ---- Arcade house ----
            S({ id: 'h_floor', layer: 'L1', geo: 'Cube',
                scale: { x: 140, y: 8, z: 110 }, sizeZ: 110,
                position: { x: HOUSE_X, y: 4, z: HOUSE_Z }, color: '#1a1814', solid: true }),
            S({ id: 'h_back', layer: 'L2', geo: 'Cube',
                scale: { x: 140, y: 70, z: 12 }, sizeZ: 12,
                position: { x: HOUSE_X, y: 40, z: HOUSE_Z - 55 }, color: '#3a342c', solid: true }),
            S({ id: 'h_left', layer: 'L2', geo: 'Cube',
                scale: { x: 12, y: 70, z: 110 }, sizeZ: 110,
                position: { x: HOUSE_X - 70, y: 40, z: HOUSE_Z }, color: '#322e28', solid: true }),
            S({ id: 'h_right', layer: 'L2', geo: 'Cube',
                scale: { x: 12, y: 70, z: 110 }, sizeZ: 110,
                position: { x: HOUSE_X + 70, y: 40, z: HOUSE_Z }, color: '#322e28', solid: true }),
            S({ id: 'h_front_l', layer: 'L2', geo: 'Cube',
                scale: { x: 48, y: 70, z: 12 }, sizeZ: 12,
                position: { x: HOUSE_X - 46, y: 40, z: HOUSE_Z + 55 }, color: '#3a342c', solid: true }),
            S({ id: 'h_front_r', layer: 'L2', geo: 'Cube',
                scale: { x: 48, y: 70, z: 12 }, sizeZ: 12,
                position: { x: HOUSE_X + 46, y: 40, z: HOUSE_Z + 55 }, color: '#3a342c', solid: true }),
            S({ id: 'h_door_top', layer: 'L2', geo: 'Cube',
                scale: { x: 44, y: 14, z: 12 }, sizeZ: 12,
                position: { x: HOUSE_X, y: 68, z: HOUSE_Z + 55 }, color: '#2a2620', solid: true }),
            S({ id: 'h_sign', layer: 'L4', geo: 'Cube',
                scale: { x: 56, y: 16, z: 6 }, sizeZ: 6,
                position: { x: HOUSE_X, y: 88, z: HOUSE_Z + 58 }, color: '#ff44cc', solid: false }),
            S({ id: 'h_win_l', layer: 'L3', geo: 'Cube',
                scale: { x: 22, y: 22, z: 4 }, sizeZ: 4,
                position: { x: HOUSE_X - 46, y: 42, z: HOUSE_Z + 62 }, color: '#88ccff', solid: false }),
            S({ id: 'h_win_r', layer: 'L3', geo: 'Cube',
                scale: { x: 22, y: 22, z: 4 }, sizeZ: 4,
                position: { x: HOUSE_X + 46, y: 42, z: HOUSE_Z + 62 }, color: '#88ccff', solid: false }),
        ];
        const westRoom = RoomBuilderV3.build(scene, westShapes, {
            layerZ: { L1: -80, L2: -20, L3: 0, L4: 40, UI: 100 }
        });
        // Merge solid boxes into main room for collision
        if (westRoom.solidBoxes && room.solidBoxes) {
            const filtered = westRoom.solidBoxes.filter(function (b) {
                const w = b.maxX - b.minX, d = b.maxZ - b.minZ;
                // roofs / flat pads
                if (w > 150 && d > 150) return false;
                return true;
            });
            room.solidBoxes = room.solidBoxes.concat(filtered);
        }
        window._westRoom = westRoom;

        // ============================================================
        // NORTH — snowy mountains + crevice (geometry)
        // ============================================================
        const MX = 0, MZ = -ZONE_L * 0.38;
        const mountainShapes = [
            // West peak mass
            S({ id: 'mt_w1', layer: 'L2', geo: 'Cube',
                scale: { x: 220, y: 180, z: 160 }, sizeZ: 160,
                position: { x: -280, y: 90, z: MZ }, color: '#d8e4f0', solid: true }),

            const segs = Math.max(3, Math.floor(len / 90));

                const t = i / segs;
                const x = x0 + dx * t;
                const z = z0 + dz * t;
                const gy = terrain ? terrain.getHeight(x, z) : RoomBuilderV3.FLOOR_Y;
                const strip = new THREE.Mesh(

                        color: 0x5a4a32,
                        transparent: true,

                        side: THREE.DoubleSide,
                        depthWrite: false

                strip.rotation.x = -Math.PI / 2;
                // orient along path

                strip.position.set(x, gy + 0.6, z);

            ctx.fillRect(0, 0, 320, 80);

            ctx.lineWidth = 4;
            ctx.strokeRect(3, 3, 314, 74);
            ctx.fillStyle = color || '#00ff66';
            ctx.font = 'bold 22px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            });

            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            const mat = new THREE.MeshBasicMaterial({
                map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false
            });

            currentDir = dir;
            player.setDirection(currentDir);
            player.setMoving(moving);
            player.update(); // advances the walk-cycle frame when moving

            // CE1 terrain height snap + collision helper
            if (terrain) {
                const halfH = (player.height || 45) * 0.5;
                pos.y = terrain.getHeight(pos.x, pos.z) + halfH;
            }
            // Skip building clamp near entrances (2D solids still fight mouth/tomb gap)
            const nearEntrance =
                (Math.abs(pos.x + 320) < 90 && Math.abs(pos.z - 100) < 110) ||
                (Math.abs(pos.x + 1550) < 100 && Math.abs(pos.z + 200) < 120);
            if (!nearEntrance && typeof collision !== 'undefined' && collision && collision.update) {
                collision.update({ player: player, enemies: activeEnemies, room: room, terrain: terrain });
            } else if (terrain) {
                const halfH = (player.height || 45) * 0.5;
                pos.y = terrain.getHeight(pos.x, pos.z) + halfH;
            }

            // Hollow rock is in-hub — no beginning.html warp
            // Tree / boulder trunk collision
            for (let ti = 0; ti < treeColliders.length; ti++) {
                const tc = treeColliders[ti];
                // never block cave mouth or tomb gate
                if (Math.hypot(tc.x + 320, tc.z - 100) < 110) continue;
                if (Math.hypot(tc.x + 1550, tc.z + 200) < 130) continue;
                const dx = pos.x - tc.x, dz = pos.z - tc.z;
                const d = Math.hypot(dx, dz);
                if (d < tc.r && d > 0.001) {
                    const push = (tc.r - d) / d;
                    pos.x += dx * push;
                    pos.z += dz * push;
                }
            }

            // Open Zone edge warps (W=2560 → ±1280, L=5000 → ±2500)
            // Sector ownership (for other AIs):
            //   WEST  → road_1 (Lost Woods / Tomb / D1) — Grok
            //   NORTH → secret_factory (Snow / D3 Ice / Industrial D7-D8) — Grok
            //   EAST  → road_2 (Lake approach) — CoPilot can extend to lake_sector
            //   SE corner (x>900 & z>1800) → lake_sector.html (CoPilot / D4)
            //   SW corner (x<-900 & z>1800) → desert_sector.html (Gemini)
            //   SOUTH → south_sector.html (Forest edge / Beach)
            const halfW = 6000; // ZONE_W/2 TP field
            const halfL = 7000;
            // WEST merged into hub — soft bound only (no road_1 warp)
            if (pos.x <= -halfW) { pos.x = -halfW + 2; }
            if (pos.x >=  halfW) pos.x = halfW - 2;
            if (pos.z <= -halfL) pos.z = -halfL + 2;
            if (pos.z >=  halfL) pos.z = halfL - 2;

            // CameraControlsV3: drag orbit + wheel zoom (south_sector pattern)
            if (typeof camCtrl !== 'undefined' && camCtrl) {
                camCtrl.update(pos);
            } else {
                camera.position.set(pos.x, pos.y + 95, pos.z + 220);
                camera.lookAt(pos.x, pos.y + 15, pos.z - 40);
            }
            if (typeof optionsMenu !== 'undefined' && optionsMenu) {
                optionsMenu.update(pos);
            }
            if (shrineSystem && shrineSystem.update) shrineSystem.update(camera);
        }

        function warpTo(url) {
            if (typeof playerState !== 'undefined' && typeof inventory !== 'undefined') {
                const pos = player && player.position ? player.position : { x: 0, y: 0, z: 0 };
                playerState.checkpoint(inventory, {
                    hp: playerState.getHp(),
                    maxHp: playerState.getMaxHp(),
                    x: pos.x, y: pos.y, z: pos.z,
                    room: url
                });
            }
            window.location.href = url;
        }
        window.warpTo = warpTo;


        function checkEnemyCollisions() {
            // Contact damage + sword attack (J) against night spawns / activeEnemies
            if (!player) return;
            const px = player.position.x, pz = player.position.z;
            const attackR = 48;
            const touchR = 28;
            const lists = [];
            if (typeof activeEnemies !== 'undefined') lists.push(activeEnemies);
            if (typeof nightSpawn !== 'undefined' && nightSpawn.getEnemies) {
                lists.push(nightSpawn.getEnemies());
            }

            // Attack pulse
            if (!window._attackCd) window._attackCd = 0;
            if (window._attackCd > 0) window._attackCd -= 1 / 60;
            const swinging = keys.attack && window._attackCd <= 0;
            if (swinging) window._attackCd = 0.28;

            lists.forEach(function (list) {
                if (!list || !list.length) return;
                for (let i = list.length - 1; i >= 0; i--) {
                    const e = list[i];
                    if (!e || e.dead) continue;
                    const mesh = e.mesh || e;
                    if (!mesh || !mesh.position || mesh.visible === false) continue;
                    const ex = mesh.position.x, ez = mesh.position.z;
                    const dist = Math.hypot(px - ex, pz - ez);

                    // Sword hit
                    if (swinging && dist < attackR) {
                        if (e.hp == null) e.hp = 3;
                        e.hp -= 1;
                        if (mesh.material) {
                            mesh.material.opacity = 0.4;
                            setTimeout(function () {
                                if (mesh.material) mesh.material.opacity = 1;
                            }, 80);
                        }
                        if (e.hp <= 0) {
                            e.dead = true;
                            mesh.visible = false;
                            try { scene.remove(mesh); } catch (err) {}
                            if (list === activeEnemies) list.splice(i, 1);
                            else if (e.remove) e.remove();
                            else if (nightSpawn && nightSpawn.removeEnemy) nightSpawn.removeEnemy(e);
                            onFieldEnemyKilled(e);
                        }
                        continue;
                    }

                    // Contact hurt player (simple)
                    if (dist < touchR && window._playerInvuln <= 0) {
                        window._playerInvuln = 0.9;
                        if (typeof hpBars !== 'undefined' && hpBars.damage) {
                            hpBars.damage(player.mesh, 1);
                        }
                    }
                }
            });
            if (window._playerInvuln > 0) window._playerInvuln -= 1 / 60;
        }

        function checkScreenProximity() {
            if (isOverlayOpen) return;
            const nearCave = Math.abs(player.position.x - (-320)) < 55 && Math.abs(player.position.z - (140)) < 55;
            if (nearCave && !window._swordTaken) {
                hudSub.innerHTML = '<span style="color:#88ff88;">[ F — TAKE SWORD / TALK ]</span>';
            } else if (nearCave) {
                hudSub.innerHTML = '<span style="color:#88ccff;">[ HOLLOW ROCK — OLD MAN ]</span>';
            } else if (Math.abs(player.position.x + 1550) < 80 && Math.abs(player.position.z + 190) < 80) {
                hudSub.innerHTML = '<span style="color:#aa88ff;">[ F — ENTER THE TOMB / D1 ]</span>';
            } else if (Math.abs(player.position.x + 1100) < 70 && Math.abs(player.position.z + 300) < 70) {
                hudSub.innerHTML = '<span style="color:#ff66cc;">[ F — ENTER ARCADE 1 ]</span>';
            } else if (Math.abs(player.position.x) < 80 && player.position.z < -ZONE_L * 0.28) {
                hudSub.innerHTML = '<span style="color:#aaccff;">[ NORTH — SNOW CREVICE ]</span>';
            } else {
                hudSub.innerHTML = 'WASD move | ARROWS cam | J attack | B bomb | F action | O ocarina';
            }
        }

        function checkScreenInteraction() {
            const p = player.position;
            if (typeof shrineSystem !== 'undefined' && shrineSystem && shrineSystem.tryInteract(p)) return;
            // Sword pickup in hollow rock
            if (!window._swordTaken && window._swordPickup &&
                Math.abs(p.x - window._swordPickup.position.x) < 40 &&
                Math.abs(p.z - window._swordPickup.position.z) < 40) {
                inventory.give('woodsword');
                inventory.equip('woodsword');
                window._swordTaken = true;
                scene.remove(window._swordPickup);
                if (typeof playerState !== 'undefined') {
                    playerState.setFlag('sword_taken', true);
                    playerState.syncFromInventory(inventory);
                    playerState.save();
                }
                statusEl.textContent = 'Picked up WOOD SWORD';
                return;
            }
            // Talk to old man
            if (window._oldMan &&
                Math.abs(p.x - window._oldMan.position.x) < 45 &&
                Math.abs(p.z - window._oldMan.position.z) < 45) {
                statusEl.textContent = 'OLD MAN: It is dangerous to go alone! Take this.';
                return;
            }

            // Hidden Palace (D4) — south, NIGHT ONLY
            if (window._hiddenPalace &&
                Math.abs(p.x - window._hiddenPalace.x) < 90 &&
                Math.abs(p.z - window._hiddenPalace.z) < 120) {
                const night = (typeof clock !== 'undefined' && clock.isNight && clock.isNight());
                if (night && window._hiddenPalace.active) {
                    warpTo('d_4.html');
                    return;
                }
                statusEl.textContent = night
                    ? 'Hidden Palace — the door is open (F).'
                    : 'An empty clearing. Locals whisper of a palace that only appears at night.';
                return;
            }





            // North Industrial D7 — after Song of Time
            if (window._northFog &&
                Math.abs(p.x - window._northFog.d7.x) < 70 &&
                Math.abs(p.z - window._northFog.d7.z) < 70) {
                if (!window._northFog.cleared) {
                    statusEl.textContent = 'Impenetrable dark fog. The Song of Time may clear the ages… (O)';
                    return;
                }
                warpTo('d_7.html');
                return;
            }
            // North Final D8 — Chromac Key or Big Key
            if (window._northFog &&
                Math.abs(p.x - window._northFog.d8.x) < 70 &&
                Math.abs(p.z - window._northFog.d8.z) < 70) {
                if (!window._northFog.cleared) {
                    statusEl.textContent = 'Fog swallows the final gate. Play the Song of Time first.';
                    return;
                }
                const hasKey = (inventory.has && (inventory.has('chromackey') || inventory.has('bigkey')));
                if (!hasKey) {
                    statusEl.textContent = 'Final annex sealed — need the Chromac Key (or Big Key).';
                    return;
                }
                warpTo('d_8.html');
                return;
            }

            // Fairy fountains — enter when drained (Song of Storms)
            if (window._fairyFountains) {
                for (let i = 0; i < window._fairyFountains.length; i++) {
                    const f = window._fairyFountains[i];
                    if (Math.hypot(p.x - f.x, p.z - f.z) < 55) {
                        if (f.flooded) {
                            statusEl.textContent = 'The fountain is submerged. Song of Storms may drain it… (O)';
                            return;
                        }
                        if (!f.healed && typeof hpBars !== 'undefined') {
                            f.healed = true;
                            if (hpBars.heal) hpBars.heal(player.mesh, 6);
                            else if (hpBars.attach) { /* full restore message */ }
                            statusEl.textContent = 'A fairy restores your strength!';
                            try {
                                const a = new Audio('assets/fanfare/itemfanfare.wav');
                                a.volume = 0.45; a.play().catch(function () {});
                            } catch (e) {}
                        } else {
                            statusEl.textContent = 'The fairy fountain is quiet for now.';
                        }
                        return;
                    }
                }
            }
            // Desert Palace D6 — SW — statues cleared by Song of Mudora
            if (window._desertPalace &&
                Math.abs(p.x - window._desertPalace.x) < 90 &&
                Math.abs(p.z - window._desertPalace.z) < 100) {
                if (window._desertPalace.open) {
                    warpTo('d_6.html');
                    return;
                }
                statusEl.textContent = 'Stone guardians bar the Desert Palace. Play the Song of Mudora (O).';
                return;
            }
            // Bomb pickups
            if (window._bombs && window._bombs.tryPickup(p.x, p.z, 40)) return;
            // Bomb Cave D2 — east lake — clear boulders with bombs
            if (window._bombCave &&
                Math.abs(p.x - window._bombCave.x) < 85 &&
                Math.abs(p.z - window._bombCave.z) < 85) {
                if (window._bombCave.cleared) {
                    warpTo('d_2.html');
                    return;
                }
                statusEl.textContent = 'Boulders seal the cave. Pick up bombs nearby, press B to place.';
                return;
            }
            // Lantern pickup (Ice Palace approach)
            if (window._lanternPickup && window._lanternPickup.mesh && window._lanternPickup.mesh.visible &&
                Math.abs(p.x - window._lanternPickup.x) < 45 &&
                Math.abs(p.z - window._lanternPickup.z) < 45) {
                inventory.give('lantern');
                inventory.equip('lantern');
                window._lanternPickup.mesh.visible = false;
                statusEl.textContent = 'Picked up LANTERN — the ice may yield to its warmth.';
                return;
            }
            // Ice Palace D3 — requires lantern ON to melt barrier
            if (window._icePalace &&
                Math.abs(p.x - window._icePalace.x) < 90 &&
                Math.abs(p.z - window._icePalace.z) < 90) {
                const ice = window._icePalace;
                const hasLantern = inventory.has && inventory.has('lantern');
                const lit = inventory.isLanternOn && inventory.isLanternOn();
                if (ice.melted) {
                    warpTo('d_3.html');
                    return;
                }
                if (!hasLantern) {
                    statusEl.textContent = 'A solid block of ice seals the palace. You need a lantern to melt it.';
                    return;
                }
                if (!lit) {
                    statusEl.textContent = 'Equip and light the lantern (2) to melt the ice.';
                    return;
                }
                // Melting in progress — complete on interact while lit
                ice.melted = true;
                ice.cube.visible = false;
                ice.cube.userData.iceBarrier = false;
                statusEl.textContent = 'The ice melts away! Ice Palace is open.';
                return;
            }
            // Raft pickup on lake shore
            if (window._raftPickup && window._raftPickup.mesh && window._raftPickup.mesh.visible &&
                Math.abs(p.x - window._raftPickup.x) < 50 &&
                Math.abs(p.z - window._raftPickup.z) < 50) {
                inventory.give('raft');
                window._raftPickup.mesh.visible = false;
                statusEl.textContent = 'Picked up RAFT — Meta never got this far.';
                return;
            }
            // Water Palace D5 — NE lake — requires RAFT
            if (window._waterPalace &&
                Math.abs(p.x - window._waterPalace.x) < 110 &&
                Math.abs(p.z - window._waterPalace.z) < 130) {
                if (inventory.has && inventory.has('raft')) {
                    warpTo('d_5.html');
                    return;
                }
                statusEl.textContent = (window._waterPalace.plaque || 'Need a raft.') +
                    ' You stare at the water. Meta stares back.';
                return;
            }
            // Tomb door → D1 (palace layout)
            if (Math.abs(p.x - (-1550)) < 70 && Math.abs(p.z - (-200)) < 80) {
                warpTo('d_1.html'); return;
            }
            // Merged land dungeon doors
            if (window._dungeonDoors) {
                const doors = window._dungeonDoors;
                for (const id in doors) {
                    if (id === 'd1') continue;
                    const d = doors[id];
                    if (Math.abs(p.x - d.x) < 60 && Math.abs(p.z - d.z) < 60) {
                        warpTo(d.url); return;
                    }
                }
            }
        }

        function openOverlay() { /* stage menu removed */ }

        function closeOverlay() { isOverlayOpen = false; isWarping = false; }

        let autosaveAcc = 0;
        function animate() {
            requestAnimationFrame(animate);
            if (optionsMenu && optionsMenu.beginFrame && !optionsMenu.beginFrame(performance.now())) {
                return;
            }
            const _dt = 1 / 60;
            if (window._lakeWater && window._lakeWater.update) window._lakeWater.update(_dt);
            if (window._stormWeatherTimer != null && window._stormWeatherTimer > 0) {
                window._stormWeatherTimer -= _dt;
                if (window._stormWeather && window._stormWeather.update) {
                    window._stormWeather.update(_dt, player && player.position, scene.fog);
                }
                if (window._stormWeatherTimer <= 0 && window._stormWeather && window._stormWeather.group) {
                    window._stormWeather.group.visible = false;
                }
            }
            if (window._bombs && window._bombs.update) window._bombs.update(_dt);

            if (window._iceWeather && window._iceWeather.update) {
                window._iceWeather.update(_dt, player && player.position, scene.fog);
            }
            // Ice cube melts gradually when lantern is ON nearby
            if (window._icePalace && !window._icePalace.melted && player && inventory) {
                const ice = window._icePalace;
                const near = Math.hypot(player.position.x - ice.x, player.position.z - ice.z) < 100;
                const lit = inventory.isLanternOn && inventory.isLanternOn();
                if (near && lit) {
                    ice.meltProgress = Math.min(1, (ice.meltProgress || 0) + _dt * 0.25);
                    if (ice.cube && ice.cube.material) {
                        ice.cube.material.opacity = 0.35 * (1 - ice.meltProgress);
                    }
                    if (ice.meltProgress >= 1) {
                        ice.melted = true;
                        ice.cube.visible = false;
                        statusEl.textContent = 'The ice barrier melts completely!';
                    }
                }
            }
            // Ice collision: block player while frozen
            
            // North fog: block walking into industrial belt until cleared
            if (window._northFog && !window._northFog.cleared && player) {
                if (player.position.z < window._northFog.barrierZ) {
                    player.position.z = window._northFog.barrierZ;
                    // occasional hint
                    if (Math.random() < 0.01) {
                        statusEl.textContent = 'A wall of dark fog blocks the north…';
                    }
                }
                // Drift particles
                if (window._northFog.particles) {
                    const arr = window._northFog.particles.geometry.attributes.position.array;
                    for (let i = 0; i < arr.length; i += 3) {
                        arr[i] += Math.sin(performance.now() * 0.001 + i) * 0.15;
                        arr[i + 1] += 0.05;
                        if (arr[i + 1] > 140) arr[i + 1] = 10;
                    }
                    window._northFog.particles.geometry.attributes.position.needsUpdate = true;
                }
            }

            // Desert statue collision (while closed)
            if (window._desertPalace && !window._desertPalace.open && player) {
                window._desertPalace.statues.forEach(function (s) {
                    const sx = s.body.position.x, sz = s.body.position.z;
                    const dx = player.position.x - sx, dz = player.position.z - sz;
                    const dist = Math.hypot(dx, dz);
                    if (dist < 28 && dist > 0.01) {
                        const push = (28 - dist) / dist;
                        player.position.x += dx * push;
                        player.position.z += dz * push;
                    }
                });
            }
            // D2 boulder collision
            if (window._bombCave && player) {
                window._bombCave.boulders.forEach(function (b) {
                    if (!b.alive) return;
                    const dx = player.position.x - b.x;
                    const dz = player.position.z - b.z;
                    const dist = Math.hypot(dx, dz);
                    if (dist < b.r && dist > 0.01) {
                        const push = (b.r - dist) / dist;
                        player.position.x += dx * push;
                        player.position.z += dz * push;
                    }
                });
            }
            if (window._icePalace && !window._icePalace.melted && player) {
                const s = window._icePalace.solid;
                const px = player.position.x, pz = player.position.z;
                const r = 16;
                if (px + r > s.minX && px - r < s.maxX && pz + r > s.minZ && pz - r < s.maxZ) {
                    // push out to nearest edge
                    const cx = (s.minX + s.maxX) * 0.5;
                    const cz = (s.minZ + s.maxZ) * 0.5;
                    const dx = px - cx, dz = pz - cz;
                    if (Math.abs(dx) > Math.abs(dz)) {
                        player.position.x = dx > 0 ? s.maxX + r : s.minX - r;
                    } else {
                        player.position.z = dz > 0 ? s.maxZ + r : s.minZ - r;
                    }
                }
            }

            if (window._lakeWeather && window._lakeWeather.update) {
                window._lakeWeather.update(_dt, player && player.position, scene.fog);
            }
            if (window._ocarina && window._ocarina.update) window._ocarina.update(_dt);
            autosaveAcc += _dt;
            if (autosaveAcc > 10 && typeof playerState !== 'undefined' && typeof inventory !== 'undefined') {
                autosaveAcc = 0;
                playerState.syncFromInventory(inventory).save();
            }
            // Day/night sky + light drive
            if (typeof sky !== 'undefined' && sky && (!optionsMenu || optionsMenu.shouldUpdateSky())) {
                const sun = scene.getObjectByName('terrain-sun');
                const ambs = scene.children.filter(c => c.isAmbientLight);
                sky.update(_dt, {
                    camera: camera,
                    sun: sun || undefined,
                    ambient: ambs[0] || undefined,
                    fog: scene.fog,
                    background: scene.background
                });
                if (typeof clock !== 'undefined') clock.setHour(sky.getHour());

            // Hidden Palace appears only at night (and dusk)
            if (window._hiddenPalace) {
                const night = (typeof clock !== 'undefined' && clock.isNight && clock.isNight());
                const hp = window._hiddenPalace;
                if (hp.active !== night) {
                    hp.active = night;
                    hp.group.visible = night;
                    if (hp.door && hp.door.material) {
                        hp.door.material.emissiveIntensity = night ? 0.85 : 0.0;
                    }
                    if (night) {
                        statusEl.textContent = 'The Hidden Palace materializes in the southern woods…';
                    }
                }
                // Soft glow pulse on door at night
                if (night && hp.door && hp.door.material) {
                    hp.door.material.emissiveIntensity = 0.55 + 0.35 * Math.sin(performance.now() * 0.004);
                }
            }

            }
            if (typeof nightSpawn !== 'undefined' && (!optionsMenu || optionsMenu.shouldNightSpawn())) {
                nightSpawn.update(_dt);
                nightSpawn.faceCamera(camera);
                // Attach HP bars to new night spawns
                if (typeof hpBars !== 'undefined') {
                    nightSpawn.getEnemies().forEach(function (e) {
                        if (e.mesh && !e.mesh.userData.hpBar) {
                            hpBars.attach(e.mesh, { type: 'enemy', max: 3, current: 3, offsetY: 42 });
                        }
                    });
                }
            }
            if (typeof hpBars !== 'undefined') hpBars.update(camera);
            updatePlayerMovement();
            checkEnemyCollisions();
            checkScreenProximity();

            player.faceCamera(camera);
            activeEnemies.forEach(e => e.faceCamera(camera));
            if (typeof overworldProps !== 'undefined') {
                const doBill = !optionsMenu || optionsMenu.shouldBillboard();
                overworldProps.forEach(m => {
                    if (m.userData && m.userData.isRoad) return;
                    if (!m.visible) return;
                    if (terrain && m.userData && m.userData.propH != null) {
                        const gy = terrain.getHeight(m.userData.baseX, m.userData.baseZ);
                        m.position.y = gy + m.userData.propH * 0.45;
                    }
                    if (doBill) m.lookAt(camera.position.x, m.position.y, camera.position.z);
                });
            }
            // LOD cards face camera, stay soft on horizon
            if (typeof lodGroup !== 'undefined') {
                lodGroup.children.forEach(function (m) {
                    m.lookAt(camera.position.x, m.position.y, camera.position.z);
                });
            }
            if (window._errorSign) {
                window._errorSign.lookAt(camera.position.x, window._errorSign.position.y, camera.position.z);
            }
            if (window._swordPickup && !window._swordTaken) {
                window._swordPickup.lookAt(camera.position.x, window._swordPickup.position.y, camera.position.z);
            }
            if (window._oldMan) {
                window._oldMan.lookAt(camera.position.x, window._oldMan.position.y, camera.position.z);
            }
            RoomBuilderV3.faceBillboards(room, camera);

            statusEl.textContent = 'X:' + player.position.x.toFixed(0) + '  Z:' + player.position.z.toFixed(0) +
                '   |   Field: ' + (typeof nightSpawn !== 'undefined' ? nightSpawn.getEnemies().length : 0) + '   |   ' + (typeof clock !== 'undefined' ? clock.getPhase() : '') + '   |   Field 14000×12000 TP-scale';

            renderer.render(scene, camera);
        }

        statusEl.textContent = 'MAIN overworld center — Open Field 14000×12000 TP-scale (Forest / room1) | Check F12 console for 404s';
        console.log('=== NEONDROMEDA DEBUG ===');
